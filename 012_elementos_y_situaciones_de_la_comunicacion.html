<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectives de la Comunicación</title>
    <style>
        :root {
            --bg-dark: #2c3e50;
            --bg-light: #ecf0f1;
            --accent: #f1c40f; /* Amarillo Detective */
            --correct: #27ae60;
            --wrong: #c0392b;
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* CONTENEDOR PRINCIPAL (Tipo Celular) */
        .game-container {
            width: 100%;
            max-width: 480px; /* Ancho máximo de celular */
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* CABECERA */
        .header {
            background-color: var(--accent);
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .header h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; color: #d35400; }
        .progress-bar {
            height: 6px; background: rgba(0,0,0,0.1); margin-top: 10px; border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: #d35400; width: 0%; transition: width 0.3s; }

        /* ESCENA DEL CRIMEN (La Pregunta) */
        .scene-area {
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ddd;
            flex: 1; /* Ocupa el espacio disponible */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .scene-emoji { font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        .scene-text { font-size: 1.1rem; color: #555; margin-bottom: 15px; font-style: italic; }
        
        .question-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 90%;
        }
        .question-label { font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        .question-main { font-size: 1.3rem; font-weight: bold; color: var(--bg-dark); margin-top: 5px; }

        /* OPCIONES (Botones) */
        .options-area {
            padding: 20px;
            background: #fff;
            display: flex; flex-direction: column; gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #bdc3c7;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 10px;
            color: var(--bg-dark);
            -webkit-tap-highlight-color: transparent; /* Quitar azul en Android al tocar */
        }
        
        .option-btn:active { transform: scale(0.98); background: #f9f9f9; }
        .option-icon { font-size: 1.5rem; }

        /* MODAL DE FEEDBACK (Retroalimentación) */
        .feedback-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            padding: 30px; box-sizing: border-box; text-align: center;
        }
        .feedback-overlay.active { opacity: 1; pointer-events: auto; }

        .feedback-icon { font-size: 5rem; margin-bottom: 20px; }
        .feedback-title { font-size: 2rem; color: white; margin: 0 0 10px 0; font-weight: bold; }
        .feedback-text { font-size: 1.1rem; color: #ecf0f1; line-height: 1.5; margin-bottom: 30px; }
        
        .next-btn {
            background: var(--accent); color: #d35400; border: none;
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 0 #d35400;
        }
        .next-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d35400; }

        /* PANTALLA FINAL */
        .end-screen { display: none; text-align: center; padding: 40px; height: 100%; flex-direction: column; justify-content: center; align-items: center;}
        .score-display { font-size: 3rem; color: var(--accent); font-weight: 900; margin: 20px 0; }

    </style>
</head>
<body>

<div class="game-container">
    
    <div class="header">
        <h1>🕵️ Detectives de la Comunicación</h1>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <div id="game-screen" style="display: flex; flex-direction: column; height: 100%;">
        <div class="scene-area">
            <div class="scene-emoji" id="scene-emoji">📱</div>
            <div class="scene-text" id="scene-desc">...</div>
            
            <div class="question-box">
                <div class="question-label">Misión del Detective: Encuentra...</div>
                <div class="question-main" id="question-text">¿...?</div>
            </div>
        </div>

        <div class="options-area" id="options-container">
            </div>
    </div>

    <div id="end-screen" class="end-screen">
        <div style="font-size: 4rem;">🎉</div>
        <h2>¡Caso Cerrado!</h2>
        <p>Tu desempeño como detective fue:</p>
        <div class="score-display" id="final-score">0/0</div>
        <p id="final-msg">¡Buen trabajo!</p>
        <button class="next-btn" onclick="restartGame()">Nuevo Caso</button>
    </div>

    <div class="feedback-overlay" id="feedback">
        <div class="feedback-icon" id="fb-icon">✅</div>
        <div class="feedback-title" id="fb-title">¡Correcto!</div>
        <div class="feedback-text" id="fb-text">Explicación...</div>
        <button class="next-btn" onclick="nextQuestion()">Siguiente</button>
    </div>

</div>

<script>
    /* --- BASE DE DATOS DE CASOS --- */
    const cases = [
        {
            scene: "Juan le envía una carta de amor a María.",
            emoji: "💌👦👧",
            question: "¿Quién es el EMISOR?",
            options: [
                { text: "María", icon: "👧" },
                { text: "La Carta", icon: "✉️" },
                { text: "Juan", icon: "👦" }
            ],
            correct: 2,
            explanation: "¡Correcto! El Emisor es quien crea y envía el mensaje. En este caso, Juan fue quien escribió la carta."
        },
        {
            scene: "Un árbitro saca tarjeta roja a un jugador.",
            emoji: "🟥👮‍♂️⚽",
            question: "¿Cuál es el CÓDIGO?",
            options: [
                { text: "El pito del árbitro", icon: "🔊" },
                { text: "El color rojo", icon: "🎨" },
                { text: "El jugador expulsado", icon: "🏃" }
            ],
            correct: 1,
            explanation: "¡Exacto! El Código es el sistema de signos usado. Aquí se usa el color rojo, que todos entienden como 'expulsión'."
        },
        {
            scene: "La abuela lee una noticia en el periódico.",
            emoji: "👵📰",
            question: "¿Cuál es el CANAL?",
            options: [
                { text: "El Periódico", icon: "📄" },
                { text: "La noticia", icon: "🗞️" },
                { text: "La abuela", icon: "👵" }
            ],
            correct: 0,
            explanation: "¡Muy bien! El Canal es el medio físico por donde viaja el mensaje. Aquí es el papel impreso del periódico."
        },
        {
            scene: "Dos amigos hablando en una biblioteca en silencio.",
            emoji: "🤫📚🗣️",
            question: "¿Qué falla en el CONTEXTO?",
            options: [
                { text: "No se entienden el idioma", icon: "🤷" },
                { text: "El lugar exige silencio", icon: "🏛️" },
                { text: "El mensaje es muy largo", icon: "📏" }
            ],
            correct: 1,
            explanation: "¡Así es! El Contexto es la situación que rodea al acto. En una biblioteca, el contexto exige silencio, por lo que hablar en voz alta es inadecuado."
        },
        {
            scene: "Suena el timbre de salida en la escuela.",
            emoji: "🔔🏫🎒",
            question: "¿Cuál es el MENSAJE?",
            options: [
                { text: "Que las clases terminaron", icon: "🛑" },
                { text: "El sonido 'Ring'", icon: "🔊" },
                { text: "El director", icon: "👨‍🏫" }
            ],
            correct: 0,
            explanation: "¡Correcto! El mensaje no es el sonido en sí, sino lo que significa: que ya se puede salir de clases."
        }
    ];

    let currentIdx = 0;
    let score = 0;

    // Elementos DOM
    const uiSceneEmoji = document.getElementById('scene-emoji');
    const uiSceneDesc = document.getElementById('scene-desc');
    const uiQuestion = document.getElementById('question-text');
    const uiOptions = document.getElementById('options-container');
    const uiProgress = document.getElementById('progress');
    
    const uiFeedback = document.getElementById('feedback');
    const fbIcon = document.getElementById('fb-icon');
    const fbTitle = document.getElementById('fb-title');
    const fbText = document.getElementById('fb-text');
    const fbBtn = document.querySelector('#feedback .next-btn');

    const uiGame = document.getElementById('game-screen');
    const uiEnd = document.getElementById('end-screen');

    function initGame() {
        currentIdx = 0;
        score = 0;
        uiEnd.style.display = 'none';
        uiGame.style.display = 'flex';
        loadCase();
    }

    function loadCase() {
        const data = cases[currentIdx];
        
        // Actualizar UI
        uiSceneEmoji.textContent = data.emoji;
        uiSceneDesc.textContent = data.scene;
        uiQuestion.textContent = data.question;
        
        // Barra de progreso
        const percent = ((currentIdx) / cases.length) * 100;
        uiProgress.style.width = `${percent}%`;

        // Generar botones
        uiOptions.innerHTML = '';
        data.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-icon">${opt.icon}</span> ${opt.text}`;
            btn.onclick = () => checkAnswer(index);
            uiOptions.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const data = cases[currentIdx];
        const isCorrect = selectedIndex === data.correct;

        if (isCorrect) {
            score++;
            showFeedback(true, data.explanation);
        } else {
            // Explicación diferente si fallan
            let errorMsg = "Ese no era el elemento correcto. " + data.explanation;
            showFeedback(false, errorMsg);
        }
    }

    function showFeedback(success, text) {
        uiFeedback.classList.add('active');
        
        if(success) {
            fbIcon.textContent = "✅";
            fbTitle.textContent = "¡Excelente!";
            fbTitle.style.color = "#2ecc71";
            fbBtn.style.background = "#2ecc71";
        } else {
            fbIcon.textContent = "❌";
            fbTitle.textContent = "¡Casi!";
            fbTitle.style.color = "#e74c3c";
            fbBtn.style.background = "#e74c3c";
        }
        
        fbText.textContent = text;
    }

    function nextQuestion() {
        uiFeedback.classList.remove('active');
        currentIdx++;

        if (currentIdx < cases.length) {
            loadCase();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        uiGame.style.display = 'none';
        uiEnd.style.display = 'flex';
        uiProgress.style.width = '100%';
        
        document.getElementById('final-score').textContent = `${score}/${cases.length}`;
        
        const msg = document.getElementById('final-msg');
        if(score === cases.length) msg.textContent = "¡Eres un Detective Maestro! 🕵️‍♂️✨";
        else if(score > cases.length/2) msg.textContent = "¡Buen trabajo Agente! 👍";
        else msg.textContent = "Necesitas más entrenamiento en la academia 📖";
    }

    function restartGame() {
        initGame();
    }

    // Arrancar
    initGame();

</script>
</body>
</html>
