<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Figuras Geométricas</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Paleta de colores vibrante para niños */
        :root {
            --color-primary: #ff4757; /* Rojo Fresa */
            --color-secondary: #2ed573; /* Verde Manzana */
            --color-tertiary: #1e90ff; /* Azul Océano */
            --color-quaternary: #ffa502; /* Naranja/Amarillo Sol */
            --color-star: #eccc68; /* Amarillo Estrella */
            --color-bg: #f1f2f6; /* Fondo Suave */
            --color-shadow: rgba(0, 0, 0, 0.15);
            --color-text: #2f3542;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            /* Fondo con patrón de puntitos divertidos */
            background-color: var(--color-bg);
            background-image: radial-gradient(#d1d8e0 2px, transparent 2px);
            background-size: 30px 30px;
            padding: 20px;
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            max-width: 1000px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 40px var(--color-shadow), 0 0 0 10px rgba(255,255,255,0.5);
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* --- ENCABEZADO --- */
        .header {
            background: linear-gradient(135deg, var(--color-tertiary) 0%, #3742fa 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 8px solid var(--color-primary);
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '✨';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 3em;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.2em;
            font-weight: 600;
            color: #dfe4ea;
        }

        /* --- NAVEGACIÓN Y CONTENIDO PRINCIPAL --- */
        .main-content {
            padding: 30px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-tab {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            background-color: #f1f2f6;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: #747d8c;
            box-shadow: 0 4px 0 #dfe4ea;
        }

        .nav-tab:hover {
            transform: translateY(-2px);
            background-color: #eccc68;
            color: white;
            box-shadow: 0 6px 0 #d1a848;
        }

        .nav-tab.active {
            background-color: var(--color-primary);
            color: white;
            box-shadow: 0 4px 0 #c23642;
            transform: translateY(2px);
        }

        .tab-content {
            display: none;
            padding: 15px 0;
            animation: fadeIn 0.5s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        /* --- PESTAÑA DE EXPLORACIÓN (FIGURAS) --- */
        .figure-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 25px;
            text-align: center;
            padding: 10px;
        }

        .figure-card {
            background-color: white;
            padding: 30px 15px;
            border-radius: 25px;
            border: 4px solid #f1f2f6;
            box-shadow: 0 10px 20px var(--color-shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .figure-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 10%, transparent 10%);
            transform: scale(0);
            transition: transform 0.5s;
        }

        .figure-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--color-quaternary);
            box-shadow: 0 15px 25px rgba(255, 165, 2, 0.3);
        }

        .figure-card:hover::before {
            transform: scale(1);
        }

        .figure-card h3 {
            font-size: 1.6em;
            color: var(--color-text);
            margin-top: 15px;
            z-index: 1;
        }

        .shape-container {
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        /* Retrasar animaciones para que no floten todas al mismo tiempo */
        .figure-card:nth-child(2) .shape-container { animation-delay: 0.5s; }
        .figure-card:nth-child(3) .shape-container { animation-delay: 1s; }
        .figure-card:nth-child(4) .shape-container { animation-delay: 1.5s; }
        .figure-card:nth-child(5) .shape-container { animation-delay: 2s; }

        .shape {
            width: 80px;
            height: 80px;
            transition: all 0.3s;
            z-index: 1;
        }

        /* 1. CUADRADO */
        .shape-square {
            background-color: var(--color-primary);
            border-radius: 10px;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.15);
        }

        /* 2. TRIÁNGULO */
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 80px solid var(--color-secondary);
            /* Simulación de sombra interior usando un seudoelemento sería compleja, lo dejamos puro */
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }

        /* 3. CÍRCULO */
        .shape-circle {
            background-color: var(--color-tertiary);
            border-radius: 50%;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.15);
        }
        
        /* 4. RECTÁNGULO */
        .shape-rectangle {
            width: 100px;
            height: 60px;
            background-color: var(--color-quaternary);
            border-radius: 10px;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.15);
        }

        /* 5. ESTRELLA (NUEVA) */
        .shape-star {
            background-color: var(--color-star);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            width: 90px;
            height: 90px;
        }

        /* Tamaños aumentados para el modal */
        .modal .shape { transform: scale(1.8); margin: 30px 0; }
        .modal .shape-triangle { transform: scale(1.5); }


        /* --- DETALLE DE LA FIGURA (Modal) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(47, 53, 66, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            animation: jellyPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            border: 5px solid var(--color-quaternary);
        }

        .modal-shape-display {
            margin: 20px auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinAndPulse 8s linear infinite;
        }
        
        .modal-content h2 {
            font-size: 2.8em;
            color: var(--color-text);
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 1.2em;
            color: #57606f;
            line-height: 1.4;
        }

        .property-list {
            list-style: none;
            padding: 0;
            margin-top: 25px;
            text-align: left;
            background-color: var(--color-bg);
            border-radius: 15px;
            padding: 20px;
        }

        .property-list li {
            font-size: 1.2em;
            padding: 10px 0;
            border-bottom: 2px dashed #ced6e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .property-list li:last-child { border-bottom: none; }
        .property-list li strong { color: var(--color-primary); font-size: 1.4em; }

        .close-btn {
            background-color: var(--color-primary);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            margin-top: 30px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #c23642;
            transition: all 0.2s;
        }

        .close-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #c23642;
        }

        /* --- PESTAÑA DE ACTIVIDADES --- */
        .activity-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px 20px;
            background-color: #fff;
            border-radius: 25px;
            border: 3px dashed #ced6e0;
        }
        
        /* Barra de Progreso */
        .progress-container {
            width: 100%;
            max-width: 500px;
            background-color: #f1f2f6;
            border-radius: 20px;
            height: 20px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-tertiary), var(--color-secondary));
            width: 0%;
            border-radius: 20px;
            transition: width 0.5s ease-out;
        }

        .question-box {
            background-color: var(--color-quaternary);
            color: white;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(255, 165, 2, 0.3);
            position: relative;
        }

        .question-box::before {
            content: '🤔';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        
        .question-box p {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .option-btn {
            padding: 20px;
            background-color: #f1f2f6;
            border: 3px solid #dfe4ea;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--color-text);
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #dfe4ea;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .option-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #dfe4ea;
            background-color: #ffffff;
            border-color: var(--color-tertiary);
        }
        
        .option-btn.selected {
            border-color: var(--color-tertiary);
            background-color: #eccc68;
            color: #2f3542;
            box-shadow: 0 2px 0 #d1a848;
            transform: translateY(4px);
        }

        .feedback-message {
            min-height: 50px;
            font-size: 1.3em;
            font-weight: 700;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 15px;
            animation: jellyPop 0.4s;
        }
        
        .feedback-correct {
            background-color: #d1ffdf; 
            color: #009432;
            border: 3px solid var(--color-secondary);
        }

        .feedback-incorrect {
            background-color: #ffcccc; 
            color: #EA2027;
            border: 3px solid var(--color-primary);
        }

        .next-btn {
            background-color: var(--color-secondary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #009432;
            transition: all 0.2s;
            margin-top: 10px;
        }
        
        .next-btn:active {
            box-shadow: 0 0px 0 #009432;
            transform: translateY(6px);
        }

        /* --- KEYFRAMES Y ANIMACIONES --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes jellyPop {
            0% { transform: scale(0.8); opacity: 0; }
            40% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        @keyframes spinAndPulse {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .nav-tabs { flex-direction: column; }
            .figure-list { grid-template-columns: 1fr 1fr; }
            .options-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>🎨 El Mundo Mágico de las Formas</h1>
            <p>Toca, explora y juega para convertirte en un experto geométrico.</p>
        </header>

        <div class="main-content">
            <div class="nav-tabs">
                <div class="nav-tab active" data-tab="exploration">🔍 1. Explorar Figuras</div>
                <div class="nav-tab" data-tab="activity">🎮 2. ¡A Jugar!</div>
            </div>

            <!-- 1. PESTAÑA DE EXPLORACIÓN -->
            <div id="exploration" class="tab-content active">
                <p style="text-align: center; margin-bottom: 25px; font-size: 1.2em; font-weight: 600; color: #57606f;">
                    ¡Toca tu figura favorita para descubrir sus secretos mágicos! ✨
                </p>
                
                <div class="figure-list">
                    <div class="figure-card" data-figure="square">
                        <div class="shape-container"><div class="shape shape-square"></div></div>
                        <h3>Cuadrado</h3>
                    </div>
                    
                    <div class="figure-card" data-figure="triangle">
                        <div class="shape-container"><div class="shape shape-triangle"></div></div>
                        <h3>Triángulo</h3>
                    </div>

                    <div class="figure-card" data-figure="circle">
                        <div class="shape-container"><div class="shape shape-circle"></div></div>
                        <h3>Círculo</h3>
                    </div>

                    <div class="figure-card" data-figure="rectangle">
                        <div class="shape-container"><div class="shape shape-rectangle"></div></div>
                        <h3>Rectángulo</h3>
                    </div>

                    <!-- NUEVA FIGURA AÑADIDA -->
                    <div class="figure-card" data-figure="star">
                        <div class="shape-container"><div class="shape shape-star"></div></div>
                        <h3>Estrella</h3>
                    </div>
                </div>
            </div>

            <!-- 2. PESTAÑA DE ACTIVIDADES -->
            <div id="activity" class="tab-content">
                <div class="activity-section">
                    
                    <!-- Barra de progreso visual -->
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>

                    <div class="question-box">
                        <p id="questionText">Preparando la magia...</p>
                    </div>

                    <div class="options-grid" id="optionsGrid">
                        <!-- Botones inyectados desde JS -->
                    </div>

                    <div id="feedback" class="feedback-message" style="display: none;"></div>
                    
                    <button id="nextBtn" class="next-btn" style="display: none;">¡Siguiente Reto! 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE DETALLE DE LA FIGURA -->
    <div id="figureDetailModal" class="modal" onclick="closeFigureDetailModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalShape" class="modal-shape-display"></div>
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            
            <ul id="modalProperties" class="property-list"></ul>
            
            <button class="close-btn" onclick="closeFigureDetailModal()">¡Entendido! 👍</button>
        </div>
    </div>


    <script>
        // --- DATA DE FIGURAS Y PROPIEDADES ENRIQUECIDA ---
        const FIGURE_DATA = {
            square: {
                name: "Cuadrado 🟥",
                description: "¡Mira el Cuadrado! Es una figura muy equilibrada que vemos en ventanas, cajas y galletas.",
                properties: [
                    "Tiene 4 lados iguales.",
                    "Tiene 4 vértices (esquinas).",
                    "Es perfecto y simétrico."
                ],
                cssClass: "shape shape-square"
            },
            triangle: {
                name: "Triángulo 🔺",
                description: "El Triángulo tiene tres lados, como el techo de una casa, un trozo de pizza o la vela de un barco.",
                properties: [
                    "Tiene 3 lados.",
                    "Tiene 3 vértices (esquinas).",
                    "¡Es la figura más fuerte para construir puentes!"
                ],
                cssClass: "shape shape-triangle"
            },
            circle: {
                name: "Círculo 🔴",
                description: "El Círculo es suave y sin esquinas, como una pelota, una moneda o el Sol.",
                properties: [
                    "No tiene lados rectos.",
                    "No tiene vértices (esquinas).",
                    "¡Puede rodar muy rápido!"
                ],
                cssClass: "shape shape-circle"
            },
            rectangle: {
                name: "Rectángulo 🟦",
                description: "El Rectángulo es como el Cuadrado, pero más estirado. Lo vemos en puertas, cuadernos y en tu televisor.",
                properties: [
                    "Tiene 4 lados.",
                    "Tiene 4 vértices (esquinas).",
                    "Tiene 2 lados largos y 2 lados cortos."
                ],
                cssClass: "shape shape-rectangle"
            },
            star: {
                name: "Estrella ⭐",
                description: "¡La Estrella brilla en el cielo nocturno y la encontramos en el mar como estrellas de mar!",
                properties: [
                    "Normalmente tiene 5 puntas mágicas.",
                    "Está formada por varios triángulos unidos.",
                    "¡Es el símbolo de los campeones como tú!"
                ],
                cssClass: "shape shape-star"
            }
        };
        
        // --- DATA DE ACTIVIDADES (Emojis añadidos a las opciones) ---
        const ACTIVITY_QUESTIONS = [
            {
                question: "Si ves un rico trozo de pizza, ¿a qué figura se parece más?",
                options: ["🔺 Triángulo", "🔴 Círculo", "🟥 Cuadrado", "⭐ Estrella"],
                answer: "🔺 Triángulo",
                feedback: "¡Correcto! Un buen trozo de pizza tiene forma de Triángulo."
            },
            {
                question: "¿Qué figura NO tiene esquinas y puede rodar por el suelo?",
                options: ["🟦 Rectángulo", "🔴 Círculo", "🟥 Cuadrado", "🔺 Triángulo"],
                answer: "🔴 Círculo",
                feedback: "¡Así es! El Círculo es súper redondo y suave."
            },
            {
                question: "La pantalla de una televisión o cine normalmente tiene forma de...",
                options: ["🟥 Cuadrado", "⭐ Estrella", "🔴 Círculo", "🟦 Rectángulo"],
                answer: "🟦 Rectángulo",
                feedback: "¡Muy bien! El Rectángulo es ideal porque es más ancho que alto."
            },
            {
                question: "¿Qué figura tiene exactamente 4 lados igualitos de tamaño?",
                options: ["🔺 Triángulo", "🔴 Círculo", "🟥 Cuadrado", "🟦 Rectángulo"],
                answer: "🟥 Cuadrado",
                feedback: "¡Genial! El Cuadrado es especial por tener sus 4 lados gemelos."
            },
            {
                question: "Brilla de noche en el cielo y tiene 5 puntas... ¿Qué es?",
                options: ["🔴 Círculo", "⭐ Estrella", "🔺 Triángulo", "🟥 Cuadrado"],
                answer: "⭐ Estrella",
                feedback: "¡Excelente! Eres toda una estrellita geométrica."
            }
        ];

        // --- ESTADO GLOBAL ---
        let currentQuestionIndex = 0;
        let score = 0;
        let totalQuestions = ACTIVITY_QUESTIONS.length;
        let selectedAnswer = null;

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            setupNavigation();
            setupFigureExploration();
            loadQuestion();
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        });

        function setupNavigation() {
            const tabs = document.querySelectorAll('.nav-tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));

                    this.classList.add('active');
                    const targetId = this.dataset.tab;
                    document.getElementById(targetId).classList.add('active');
                });
            });
        }

        function setupFigureExploration() {
            document.querySelectorAll('.figure-card').forEach(card => {
                card.addEventListener('click', function() {
                    const figureKey = this.dataset.figure;
                    showFigureDetailModal(figureKey);
                });
            });
        }

        function showFigureDetailModal(figureKey) {
            const data = FIGURE_DATA[figureKey];
            if (!data) return;

            const modalShapeDisplay = document.getElementById('modalShape');
            modalShapeDisplay.innerHTML = ''; 

            const shapeElement = document.createElement('div');
            shapeElement.className = data.cssClass;
            modalShapeDisplay.appendChild(shapeElement);

            document.getElementById('modalTitle').textContent = data.name;
            document.getElementById('modalDescription').textContent = data.description;

            const propList = document.getElementById('modalProperties');
            propList.innerHTML = '';
            data.properties.forEach((prop, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${index + 1}️⃣</strong> ${prop}`;
                propList.appendChild(li);
            });

            document.getElementById('figureDetailModal').style.display = 'flex';
        }

        function closeFigureDetailModal(event) {
             if (event && event.target.id !== 'figureDetailModal') return; 
             document.getElementById('figureDetailModal').style.display = 'none';
        }

        // --- FUNCIONES DE ACTIVIDAD ---
        function updateProgressBar() {
            const progressPercentage = (currentQuestionIndex / totalQuestions) * 100;
            document.getElementById('progressBar').style.width = `${progressPercentage}%`;
        }
        
        function loadQuestion() {
            updateProgressBar();

            if (currentQuestionIndex >= totalQuestions) {
                showCompletionMessage();
                return;
            }

            const currentQ = ACTIVITY_QUESTIONS[currentQuestionIndex];
            selectedAnswer = null;
            document.getElementById('questionText').textContent = currentQ.question;
            document.getElementById('optionsGrid').innerHTML = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedback').className = 'feedback-message'; 

            currentQ.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'option-btn';
                button.addEventListener('click', () => selectOption(button, option, currentQ.answer, currentQ.feedback));
                document.getElementById('optionsGrid').appendChild(button);
            });
        }
        
        function selectOption(button, selected, correct, feedbackText) {
            if (document.getElementById('nextBtn').style.display === 'block') return;

            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            selectedAnswer = selected;
            checkAnswer(correct, feedbackText);
        }

        function checkAnswer(correctAnswer, feedbackText) {
            const feedbackElement = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const optionButtons = document.querySelectorAll('.option-btn');

            let isCorrect = (selectedAnswer === correctAnswer);
            optionButtons.forEach(btn => btn.removeEventListener('click', selectOption));

            if (isCorrect) {
                score++;
                feedbackElement.textContent = `🎉 ¡Correcto! ${feedbackText}`;
                feedbackElement.classList.add('feedback-correct');
                
                optionButtons.forEach(btn => {
                    if (btn.textContent === correctAnswer) {
                        btn.style.backgroundColor = '#d1ffdf'; 
                        btn.style.borderColor = '#009432';
                    }
                });

            } else {
                feedbackElement.textContent = `❌ ¡Ups! ${feedbackText}`;
                feedbackElement.classList.add('feedback-incorrect');
                
                optionButtons.forEach(btn => {
                    if (btn.textContent === selectedAnswer) {
                        btn.style.backgroundColor = '#ffcccc'; 
                        btn.style.borderColor = '#EA2027';
                    }
                    if (btn.textContent === correctAnswer) {
                        btn.style.backgroundColor = '#d1ffdf'; 
                        btn.style.borderColor = '#009432';
                    }
                });
            }

            feedbackElement.style.display = 'block';
            nextBtn.style.display = 'block'; 
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showCompletionMessage() {
            document.getElementById('progressBar').style.width = '100%';
            const feedbackElement = document.getElementById('feedback');
            const questionBox = document.querySelector('.question-box p');
            const optionsGrid = document.getElementById('optionsGrid');
            const nextBtn = document.getElementById('nextBtn');
            
            let message = '';
            
            if (score === totalQuestions) {
                message = `¡Eres un Súper Genio! 🏆 Acertaste ${score} de ${totalQuestions}. ¡Felicidades!`;
            } else if (score >= totalQuestions * 0.6) {
                message = `¡Muy Bien! 🌟 Acertaste ${score} de ${totalQuestions}. Sigue practicando.`;
            } else {
                message = `¡Buen Esfuerzo! 💪 Lograste ${score} de ${totalQuestions}. Vuelve a explorar las figuras e inténtalo de nuevo.`;
            }

            questionBox.textContent = "¡Juego Terminado! 🎈";
            optionsGrid.innerHTML = '';
            feedbackElement.className = 'feedback-message feedback-correct';
            feedbackElement.textContent = message;
            feedbackElement.style.display = 'block';
            nextBtn.style.display = 'none';
        }
    </script>
</body>
</html>
