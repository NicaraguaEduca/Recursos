<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mundo Mágico: Final Corregido</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --blue-light: #4facfe;
            --blue-dark: #2e86de;
            --orange-light: #f6d365;
            --orange-dark: #e67e22;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
            color: #2d3436;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            position: relative; padding: 10px; box-sizing: border-box;
        }

        /* --- FONDO ANIMADO --- */
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
            background-size: 50px 50px; animation: moveBackground 20s linear infinite; z-index: -1;
        }
        @keyframes moveBackground { from { background-position: 0 0; } to { background-position: 100px 100px; } }

        .cloud { position: absolute; background: rgba(255,255,255,0.3); border-radius: 50px; z-index: -1; animation: floatCloud 20s infinite ease-in-out; }
        .c1 { width: 120px; height: 40px; top: 10%; left: -10%; }
        .c2 { width: 80px; height: 30px; top: 20%; right: -5%; animation-direction: reverse; }
        @keyframes floatCloud { 50% { transform: translateX(20px); } }

        /* --- ENCABEZADO --- */
        header { 
            text-align: center; flex-shrink: 0; z-index: 10; 
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        
        h1 { margin: 0; font-size: 2.5rem; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,0.1); -webkit-text-stroke: 2px #3a7bd5; }

        /* --- BOTÓN JUEGO SECRETO --- */
        #secret-btn-container { z-index: 50; }
        
        .secret-game-btn {
            background: #bdc3c7; color: #7f8c8d; border: 4px solid #95a5a6;
            padding: 8px 30px; border-radius: 50px; 
            font-size: 1.2rem; font-weight: bold; cursor: not-allowed;
            pointer-events: none; transform: scale(0.9); filter: grayscale(100%);
            transition: all 0.5s;
        }

        .secret-game-btn.unlocked {
            background: linear-gradient(45deg, #FF512F, #DD2476);
            color: white; border: 3px solid white; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); pointer-events: auto;
            transform: scale(1); filter: grayscale(0%);
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* --- SELECTOR --- */
        .scene-selector {
            display: flex; gap: 10px; margin: 5px 0; padding: 8px;
            background: rgba(255,255,255,0.25); backdrop-filter: blur(10px);
            border-radius: 60px; border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0;
        }
        .scene-btn {
            border: none; width: 55px; height: 55px; border-radius: 50%; font-size: 1.8rem;
            cursor: pointer; background: #fff; box-shadow: 0 4px 0 #cbd5e0; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .scene-btn.active { transform: translateY(4px); box-shadow: none; background: #FFD93D; }

        /* --- ESCENARIO --- */
        .stage-container {
            width: 95%; max-width: 850px; flex-grow: 1; max-height: 60vh;
            background: rgba(255, 255, 255, 0.95); border-radius: 30px; padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); border: 6px solid #fff;
            display: flex; flex-direction: column; position: relative;
        }
        .stage-title { font-size: 1.4rem; color: var(--blue-dark); text-transform: uppercase; margin: 0 0 15px 0; align-self: center; background: #e3f2fd; padding: 5px 20px; border-radius: 20px; }

        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%; align-items: center; }

        .box {
            border-radius: 20px; padding: 10px; color: white; height: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
        }
        .box-right { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border-bottom: 5px solid #2e86de; }
        .box-duty { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); border-bottom: 5px solid #e67e22; }
        
        .emoji-big { font-size: 3.5rem; display: block; margin: 5px 0; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2)); }
        .label-tag { background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        h3 { font-size: 1.2rem; margin: 5px 0; }
        .desc-text { font-size: 0.9rem; margin: 0; line-height: 1.2; }
        
        .connector {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: #fff; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1); z-index: 10;
        }

        /* --- OVERLAY MEMORIA --- */
        .memory-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .memory-overlay.active { opacity: 1; pointer-events: all; }

        .game-board {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
            width: 95%; max-width: 800px;
        }
        .mem-card { background: transparent; height: 110px; perspective: 1000px; cursor: pointer; }
        .mem-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .mem-card.flipped .mem-inner { transform: rotateY(180deg); }
        .mem-card.matched .mem-inner { transform: rotateY(180deg) scale(0.9); opacity: 0.5; }

        .mem-front, .mem-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 15px; border: 3px solid white; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .mem-front { background: #FF6B6B; font-size: 2.5rem; color: white; }
        .mem-back { transform: rotateY(180deg); flex-direction: column; padding: 2px; text-align: center; color: #fff; }
        .mem-type-right { background: #2e86de; } 
        .mem-type-duty { background: #e67e22; }

        .close-game {
            margin-top: 30px; background: transparent; border: 2px solid white;
            color: white; padding: 10px 30px; border-radius: 30px; cursor: pointer; font-weight: bold;
        }

        /* --- MODAL DE VICTORIA --- */
        .victory-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 200; /* Encima de todo */
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .victory-overlay.active { opacity: 1; pointer-events: all; }

        .victory-card {
            background: white; width: 90%; max-width: 400px;
            border-radius: 40px; padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 8px solid #FFD93D;
        }
        .victory-overlay.active .victory-card { transform: scale(1); }

        .victory-icon { font-size: 6rem; display: block; margin-bottom: 20px; animation: bounce 2s infinite; }
        .victory-title { font-size: 2rem; color: #2d3436; margin: 0; text-transform: uppercase; color: #e67e22; }
        .victory-text { font-size: 1.2rem; color: #636e72; margin: 10px 0 30px 0; }
        
        .victory-btn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white; border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .victory-btn:hover { transform: scale(1.05); }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .box { padding: 10px; }
            .emoji-big { font-size: 2rem; }
            h3 { font-size: 1rem; }
            .desc-text { font-size: 0.75rem; }
            .connector { display: none; }
            .comparison-grid { gap: 10px; }
            .game-board { grid-template-columns: repeat(2, 1fr); gap: 8px; } 
            .mem-card { height: 80px; }
        }
    </style>
</head>
<body>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <header>
        <h1>🌍 Mi Mundo Mágico</h1>
        <div id="secret-btn-container">
            <button class="secret-game-btn" id="btn-unlock" onclick="openGame()">
                🔒 BLOQUEADO
            </button>
        </div>
    </header>

    <div class="scene-selector">
        <button class="scene-btn active" onclick="loadScene(0)">🏫</button>
        <button class="scene-btn" onclick="loadScene(1)">🏡</button>
        <button class="scene-btn" onclick="loadScene(2)">🏥</button>
        <button class="scene-btn" onclick="loadScene(3)">🌳</button>
        <button class="scene-btn" onclick="loadScene(4)">🌍</button>
    </div>

    <div class="stage-container">
        <h2 id="place-title" class="stage-title">En la Escuela</h2>
        <div class="comparison-grid" id="grid-content">
            </div>
    </div>

    <div class="memory-overlay" id="game-modal">
        <h2 style="color:white; margin-bottom:10px; text-align:center;">🧩 Conecta: Derecho ↔ Deber</h2>
        <div class="game-board" id="memory-grid"></div>
        <button class="close-game" onclick="closeGame()">Salir</button>
    </div>

    <div class="victory-overlay" id="victory-modal">
        <div class="victory-card">
            <span class="victory-icon">🏆</span>
            <h2 class="victory-title">¡FELICIDADES!</h2>
            <p class="victory-text">Eres oficialmente un<br><b>Super Ciudadano</b></p>
            <button class="victory-btn" onclick="location.reload()">¡Jugar otra vez!</button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    // --- DATOS ---
    const scenes = [
        {
            title: "En la Escuela 🏫",
            right: { icon: "📚", title: "Aprender", desc: "Tengo derecho a ir a clases y aprender." },
            duty:  { icon: "📝", title: "Estudiar", desc: "Mi deber es hacer la tarea." }
        },
        {
            title: "En mi Casa 🏡",
            right: { icon: "🥰", title: "Amor", desc: "Tengo derecho a que me quieran." },
            duty:  { icon: "🧸", title: "Ayudar", desc: "Mi deber es recoger mis juguetes." }
        },
        {
            title: "En el Doctor 🏥",
            right: { icon: "🩺", title: "Salud", desc: "Tengo derecho a ir al médico." },
            duty:  { icon: "🥦", title: "Cuidarme", desc: "Mi deber es comer sano." }
        },
        {
            title: "En el Parque 🌳",
            right: { icon: "⚽", title: "Jugar", desc: "Tengo derecho a divertirme." },
            duty:  { icon: "🤝", title: "Compartir", desc: "Mi deber es no pelear." }
        },
        {
            title: "El Planeta 🌍",
            right: { icon: "💧", title: "Ambiente", desc: "Tengo derecho a un aire limpio." },
            duty:  { icon: "♻️", title: "Proteger", desc: "Mi deber es no tirar basura." }
        }
    ];

    // ESTADO
    let visited = [true, false, false, false, false]; 
    const btns = document.querySelectorAll('.scene-btn');
    const container = document.getElementById('grid-content');

    // Inicializar
    loadSceneContent(0);
    checkUnlock(); 

    function loadScene(index) {
        btns.forEach(b => b.classList.remove('active'));
        btns[index].classList.add('active');

        loadSceneContent(index);

        if(!visited[index]) {
            visited[index] = true;
            confetti({ particleCount: 30, spread: 50, origin: { y: 0.2 }, colors: ['#FFD700'] });
        }
        checkUnlock();
    }

    function loadSceneContent(index) {
        const data = scenes[index];
        document.getElementById('place-title').innerText = data.title;
        container.innerHTML = `
            <div class="box box-right animate__animated animate__zoomInLeft">
                <span class="label-tag">🎁 Derecho</span>
                <span class="emoji-big">${data.right.icon}</span>
                <div><h3>${data.right.title}</h3><p class="desc-text">${data.right.desc}</p></div>
            </div>
            <div class="connector">➡</div>
            <div class="box box-duty animate__animated animate__zoomInRight">
                <span class="label-tag">🚀 Deber</span>
                <span class="emoji-big">${data.duty.icon}</span>
                <div><h3>${data.duty.title}</h3><p class="desc-text">${data.duty.desc}</p></div>
            </div>
        `;
    }

    function checkUnlock() {
        if (visited.every(Boolean)) {
            const btn = document.getElementById('btn-unlock');
            if (!btn.classList.contains('unlocked')) {
                btn.classList.add('unlocked');
                btn.innerHTML = '🔓 JUGAR MEMORIA';
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.1 } });
            }
        }
    }

    // --- LÓGICA MEMORIA BLINDADA ---
    let hasFlipped = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let matches = 0;

    function openGame() {
        if(document.getElementById('btn-unlock').classList.contains('unlocked')){
            document.getElementById('game-modal').classList.add('active');
            initMemoryBoard();
        }
    }

    function closeGame() {
        document.getElementById('game-modal').classList.remove('active');
        resetBoardState();
    }

    // Reinicio seguro de variables
    function resetBoardState() {
        [hasFlipped, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
        matches = 0;
    }

    function initMemoryBoard() {
        const grid = document.getElementById('memory-grid');
        grid.innerHTML = '';
        resetBoardState();
        
        let cards = [];
        scenes.forEach((s, i) => {
            cards.push({ id: i, type: 'right', icon: s.right.icon, text: s.right.title });
            cards.push({ id: i, type: 'duty', icon: s.duty.icon, text: s.duty.title });
        });

        // Algoritmo Fisher-Yates para barajar perfectamente
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }

        cards.forEach(card => {
            const el = document.createElement('div');
            el.className = 'mem-card';
            el.dataset.id = card.id;
            el.addEventListener('click', () => flipCard(el));
            
            const colorClass = card.type === 'right' ? 'mem-type-right' : 'mem-type-duty';
            const label = card.type === 'right' ? '🎁' : '🚀';

            el.innerHTML = `
                <div class="mem-inner">
                    <div class="mem-front">?</div>
                    <div class="mem-back ${colorClass}">
                        <div style="font-size:2rem">${card.icon}</div>
                        <div style="font-size:0.7rem; text-transform:uppercase;">${label} ${card.text}</div>
                    </div>
                </div>
            `;
            grid.appendChild(el);
        });
    }

    function flipCard(card) {
        if (lockBoard) return;
        if (card === firstCard) return;

        card.classList.add('flipped');

        if (!hasFlipped) {
            hasFlipped = true;
            firstCard = card;
            return;
        }

        secondCard = card;
        // BLOQUEO INMEDIATO: Evita clics extra
        lockBoard = true; 
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.id === secondCard.dataset.id;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        // Eliminar listeners para evitar interacciones con cartas ya listas
        firstCard.style.pointerEvents = 'none';
        secondCard.style.pointerEvents = 'none';

        setTimeout(() => {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            resetBoard(); // Desbloquear tablero
            matches++;
            if(matches === scenes.length) winGame();
        }, 500);
    }

    function unflipCards() {
        // El tablero ya está bloqueado desde flipCard
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard(); // Desbloquear tablero
        }, 1000);
    }

    function resetBoard() {
        [hasFlipped, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function winGame() {
        confetti({ particleCount: 300, spread: 180, zIndex: 300 });
        setTimeout(() => {
            document.getElementById('game-modal').classList.remove('active');
            document.getElementById('victory-modal').classList.add('active');
        }, 800);
    }

</script>
</body>
</html>
