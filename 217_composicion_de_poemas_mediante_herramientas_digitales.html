<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>🤖📝 El Poeta Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 8px #81c784;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 6px solid #2e7d32;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PANTALLA INTRO ===== */
        .intro-screen {
            text-align: center;
            background: radial-gradient(circle, #f0f4c3 0%, #cddc39 100%);
        }
        .mascot {
            font-size: 7rem;
            margin-bottom: 0;
            text-shadow: 4px 4px 0px #9e9d24;
            animation: float 3s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        h1 {
            font-size: 3.5rem;
            color: #d32f2f;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #ffc107;
            line-height: 1.1;
        }
        .instruction-box {
            background: white;
            border: 4px dashed #ff9800;
            padding: 1.5rem;
            border-radius: 30px;
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .highlight {
            color: #1976d2;
            font-weight: bold;
        }
        .btn-start {
            background: #ff5722;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #d84315;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #d84315;
        }

        /* ===== PANTALLA JUEGO ===== */
        .game-screen {
            background: #e8f5e9;
            padding: 1rem;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #00796b;
            padding: 15px 25px;
            border-radius: 40px;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 0 #004d40;
        }
        .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b2dfdb;
            text-align: center;
            flex-grow: 1;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Controles Profesor */
        .teacher-controls {
            display: none;
            background: #fff3e0;
            border: 4px solid #ffb300;
            padding: 15px;
            border-radius: 30px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .teacher-controls.active {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            animation: fadeIn 0.4s;
        }
        .btn-tool {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #f57c00;
            transition: all 0.1s;
        }
        .btn-tool:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .btn-tool.tool-active {
            background: #f57c00;
            box-shadow: 0 2px 0 #e65100;
            transform: translateY(4px);
        }

        /* Libreta (Contenedor del Poema) */
        .notebook {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 2rem;
            font-size: 1.8rem;
            line-height: 2;
            color: #333;
            position: relative;
            background-image: repeating-linear-gradient(white 0px, white 39px, #64b5f6 40px);
            border-left: 40px solid #ef5350;
        }
        .notebook::before {
            content: '';
            position: absolute;
            top: 0; left: -20px; bottom: 0; width: 10px;
            background: radial-gradient(circle, #fff 50%, transparent 50%);
            background-size: 10px 40px;
        }

        /* Estilos del Poema */
        .poem-container {
            position: relative;
        }
        .verse {
            position: relative;
            padding-left: 10px;
            border-radius: 5px;
            transition: background 0.3s, transform 0.3s;
        }
        .verse-number {
            position: absolute;
            left: -40px;
            color: #ef5350;
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .rhyme-word {
            display: inline-block;
            transition: all 0.3s;
            padding: 0 5px;
            border-radius: 5px;
        }

        /* Clases de Animación y Resaltado */
        .show-verses .verse { background: rgba(255, 235, 59, 0.3); margin-bottom: 5px; border-left: 5px solid #ffc107;}
        .show-verses .verse-number { opacity: 1; }
        
        .show-stanza {
            outline: 6px dashed #9c27b0;
            outline-offset: 10px;
            border-radius: 10px;
            background: rgba(225, 190, 231, 0.2);
        }

        .show-rhymes .r-a { background: #ff4081; color: white; transform: scale(1.1); font-weight: bold; box-shadow: 0 4px 0 #c51162;}
        .show-rhymes .r-b { background: #00bcd4; color: white; transform: scale(1.1); font-weight: bold; box-shadow: 0 4px 0 #006064;}

        /* Zona de Práctica */
        .drop-zone {
            display: inline-block;
            min-width: 120px;
            height: 40px;
            border: 3px dashed #9e9e9e;
            border-radius: 10px;
            vertical-align: middle;
            background: #f5f5f5;
        }
        .drop-zone.filled {
            border-style: solid;
            border-color: #4caf50;
            background: #c8e6c9;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
        }
        
        .word-options {
            display: none;
            margin-top: 30px;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .word-options.active {
            display: flex;
        }
        .word-btn {
            background: #ba68c8;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #7b1fa2;
            transition: transform 0.1s;
        }
        .word-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Botones de Modos */
        .mode-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        .mode-btn {
            background: white;
            border: 4px solid #bdc3c7;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #7f8c8d;
            box-shadow: 0 6px 0 #bdc3c7;
            transition: all 0.1s;
        }
        .mode-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .mode-btn.active {
            background: #2196f3;
            color: white;
            border-color: #1976d2;
            box-shadow: 0 6px 0 #0d47a1;
        }

        /* Responsive */
        @media (max-width: 650px) {
            h1 { font-size: 2.2rem; }
            .notebook { font-size: 1.3rem; line-height: 1.8; padding: 1.5rem; border-left-width: 25px; }
            .verse-number { left: -25px; font-size: 1rem; }
            .header { flex-direction: column; text-align: center; gap: 10px; border-radius: 20px; }
            .status-text { font-size: 1.1rem; }
            .mode-buttons { gap: 10px; flex-direction: row; }
            .mode-btn { font-size: 1rem; padding: 10px 15px; }
            .btn-tool { font-size: 1rem; padding: 8px 15px;}
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ===== INTRO ===== -->
        <div id="introScreen" class="screen intro-screen active">
            <div class="intro-content">
                <div class="mascot">🤖📝</div>
                <h1>El Poeta Digital</h1>
                <div class="instruction-box">
                    ¡Aprende los secretos de la poesía!<br>
                    Descubre qué es un <span class="highlight">Verso</span> (una línea),<br>
                    qué es una <span class="highlight">Estrofa</span> (un grupo) <br>
                    y cómo suena la <span class="highlight">Rima</span>.
                </div>
                <button class="btn-start" id="startBtn">▶ ¡Abrir Libreta!</button>
            </div>
        </div>

        <!-- ===== JUEGO ===== -->
        <div id="gameScreen" class="screen game-screen">
            <div class="header">
                <div class="status-text" id="statusText">👨‍🏫 ¡El Profe Explica!</div>
            </div>

            <div class="main-area">
                
                <!-- Panel del Profesor -->
                <div class="teacher-controls active" id="teacherControls">
                    <button class="btn-tool" id="btnVersos">1️⃣ Contar Versos</button>
                    <button class="btn-tool" id="btnEstrofa">📦 Ver Estrofa</button>
                    <button class="btn-tool" id="btnRima">🎵 Escuchar Rima</button>
                </div>

                <!-- Libreta (Contenido Dinámico) -->
                <div class="notebook" id="notebook">
                    <!-- Aquí se inyecta el poema -->
                </div>

                <!-- Opciones de Palabras (Modo Práctica) -->
                <div class="word-options" id="wordOptions">
                    <!-- Botones dinámicos -->
                </div>

                <!-- Botones de modo -->
                <div class="mode-buttons">
                    <button class="mode-btn active" id="btnTeach">👨‍🏫 Explicar</button>
                    <button class="mode-btn" id="btnPractice">🎮 ¡Tu Turno!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==== DATOS DE LOS POEMAS ====
        const teachPoem = `
            <div class="poem-container" id="poemContent">
                <div class="verse"><span class="verse-number">1</span>El robot es muy <span class="rhyme-word r-a">chiquitito</span>,</div>
                <div class="verse"><span class="verse-number">2</span>y camina muy <span class="rhyme-word r-a">despacito</span>.</div>
                <div class="verse"><span class="verse-number">3</span>Tiene luces de <span class="rhyme-word r-b">color</span>,</div>
                <div class="verse"><span class="verse-number">4</span>y funciona con <span class="rhyme-word r-b">motor</span>.</div>
            </div>
        `;

        const practicePoem = `
            <div class="poem-container">
                <div class="verse">Tengo un lindo perrito,</div>
                <div class="verse">que es muy <span class="drop-zone" id="drop1">...</span></div>
                <div class="verse">Le gusta su pelota,</div>
                <div class="verse">que siempre <span class="drop-zone" id="drop2">...</span></div>
            </div>
        `;

        const practiceAnswers = [
            { id: 'drop1', correct: 'suavecito', options: ['suavecito', 'grandulón', 'veloz'] },
            { id: 'drop2', correct: 'rebota', options: ['se esconde', 'rebota', 'vuela'] }
        ];

        let mode = 'teach'; 
        let currentDropTarget = 0; // Índice de la respuesta actual

        // Elementos DOM
        const introScreen = document.getElementById('introScreen');
        const gameScreen = document.getElementById('gameScreen');
        const statusText = document.getElementById('statusText');
        const teacherControls = document.getElementById('teacherControls');
        const notebook = document.getElementById('notebook');
        const wordOptionsContainer = document.getElementById('wordOptions');
        
        const btnVersos = document.getElementById('btnVersos');
        const btnEstrofa = document.getElementById('btnEstrofa');
        const btnRima = document.getElementById('btnRima');
        
        const btnTeach = document.getElementById('btnTeach');
        const btnPractice = document.getElementById('btnPractice');

        // ==== AUDIO SIMPLE ====
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') { 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'magic') { 
                [400, 600, 800].forEach((f, i) => {
                    const oscN = audioCtx.createOscillator();
                    const gainN = audioCtx.createGain();
                    oscN.connect(gainN);
                    gainN.connect(audioCtx.destination);
                    oscN.frequency.value = f;
                    gainN.gain.setValueAtTime(0.05, audioCtx.currentTime + i * 0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.2);
                    oscN.start(audioCtx.currentTime + i * 0.1);
                    oscN.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                });
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const oscN = audioCtx.createOscillator();
                    const gainN = audioCtx.createGain();
                    oscN.connect(gainN);
                    gainN.connect(audioCtx.destination);
                    oscN.frequency.value = f;
                    gainN.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.4);
                    oscN.start(audioCtx.currentTime + i * 0.1);
                    oscN.stop(audioCtx.currentTime + i * 0.1 + 0.4);
                });
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ==== LÓGICA MODO PROFESOR ====
        function clearPoemEffects() {
            const container = document.getElementById('poemContent');
            if(container) {
                container.classList.remove('show-verses', 'show-stanza', 'show-rhymes');
            }
            btnVersos.classList.remove('tool-active');
            btnEstrofa.classList.remove('tool-active');
            btnRima.classList.remove('tool-active');
        }

        btnVersos.addEventListener('click', () => {
            playSound('pop');
            clearPoemEffects();
            document.getElementById('poemContent').classList.add('show-verses');
            btnVersos.classList.add('tool-active');
            statusText.textContent = "Cada línea escrita se llama VERSO.";
        });

        btnEstrofa.addEventListener('click', () => {
            playSound('pop');
            clearPoemEffects();
            document.getElementById('poemContent').classList.add('show-stanza');
            btnEstrofa.classList.add('tool-active');
            statusText.textContent = "Un grupo de versos forman una ESTROFA.";
        });

        btnRima.addEventListener('click', () => {
            playSound('magic');
            clearPoemEffects();
            document.getElementById('poemContent').classList.add('show-rhymes');
            btnRima.classList.add('tool-active');
            statusText.textContent = "¡La RIMA es cuando las palabras finales suenan igual!";
        });

        // ==== LÓGICA MODO PRÁCTICA ====
        function loadPracticeQuestion() {
            if (currentDropTarget >= practiceAnswers.length) {
                statusText.textContent = "🌟 ¡Poema completado! Eres un gran poeta.";
                wordOptionsContainer.innerHTML = '';
                playSound('win');
                return;
            }

            const currentTask = practiceAnswers[currentDropTarget];
            statusText.textContent = "Elige la palabra que rime para completar el verso.";
            
            wordOptionsContainer.innerHTML = '';
            // Mezclar opciones
            const shuffledOptions = [...currentTask.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = word;
                btn.addEventListener('click', () => checkAnswer(word, currentTask));
                wordOptionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedWord, task) {
            if (selectedWord === task.correct) {
                playSound('magic');
                const dropZone = document.getElementById(task.id);
                dropZone.textContent = selectedWord;
                dropZone.classList.add('filled');
                currentDropTarget++;
                loadPracticeQuestion();
            } else {
                playSound('error');
                statusText.textContent = "¡Ups! Esa no rima. Escucha bien el sonido final.";
                const btn = Array.from(wordOptionsContainer.children).find(b => b.textContent === selectedWord);
                btn.style.transform = 'translateX(5px)';
                setTimeout(() => btn.style.transform = '', 100);
            }
        }

        // ==== CAMBIO DE MODOS ====
        function setMode(newMode) {
            mode = newMode;
            if (mode === 'teach') {
                teacherControls.classList.add('active');
                wordOptionsContainer.classList.remove('active');
                notebook.innerHTML = teachPoem;
                statusText.textContent = "👨‍🏫 Usa los botones para explicar a la clase.";
                btnTeach.classList.add('active');
                btnPractice.classList.remove('active');
                clearPoemEffects();
            } else {
                teacherControls.classList.remove('active');
                wordOptionsContainer.classList.add('active');
                notebook.innerHTML = practicePoem;
                btnPractice.classList.add('active');
                btnTeach.classList.remove('active');
                currentDropTarget = 0;
                loadPracticeQuestion();
            }
        }

        // ==== INICIALIZACIÓN ====
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!audioCtx) playSound('pop'); 
            introScreen.classList.remove('active');
            gameScreen.classList.add('active');
            setMode('teach');
        });

        btnTeach.addEventListener('click', () => setMode('teach'));
        btnPractice.addEventListener('click', () => setMode('practice'));

    </script>
</body>
</html>
