<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feria de Ideas: Pitch Maestro 💡</title>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --startup-purple: #6366f1;
            --success-green: #22c55e;
            --error-red: #ef4444;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Public Sans', sans-serif; }
        h2, h3, .btn-action { font-family: 'Unbounded', sans-serif; text-transform: uppercase; }

        body { background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- OVERLAYS --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card-ui {
            background: white; color: #1e293b; padding: 30px; border-radius: 30px;
            text-align: center; max-width: 450px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .info-box {
            text-align: left; background: #f1f5f9; padding: 15px; border-radius: 15px;
            margin: 15px 0; font-size: 0.85rem; color: #334155; line-height: 1.4;
        }

        /* --- FEEDBACK REAL-TIME --- */
        .feedback-pop {
            position: absolute; inset: 0; background: rgba(255,255,255,0.98);
            z-index: 50; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 30px; text-align: center; color: #1e293b;
            border-radius: 20px;
        }

        /* --- ESCENARIO --- */
        .escenario { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }

        .product-preview {
            background: #1e293b; padding: 15px; border-radius: 20px; text-align: center;
            border: 2px solid var(--startup-purple); margin-bottom: 20px; width: 100%; max-width: 380px;
        }

        .jury-box { display: flex; gap: 15px; margin-bottom: 15px; }
        .jury-member { font-size: 2.2rem; transition: 0.3s; }

        .options-grid {
            display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 450px;
        }

        .option-btn {
            background: #1e293b; border: 2px solid #334155; color: white;
            padding: 16px; border-radius: 15px; cursor: pointer; text-align: left;
            font-size: 0.85rem; transition: 0.2s; position: relative;
        }
        .option-btn:hover { border-color: var(--startup-purple); }

        .meter-container {
            width: 100%; max-width: 400px; height: 10px; background: #334155;
            border-radius: 10px; overflow: hidden; margin: 10px 0;
        }
        .meter-fill { height: 100%; background: var(--startup-purple); transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body x-data="pitchGame()">

    <template x-if="faseGame === 'inicio'">
        <div class="overlay">
            <div class="card-ui">
                <div style="font-size: 3rem; margin-bottom: 10px;">🎤🚀</div>
                <h2>Feria de Ideas</h2>
                <div class="info-box">
                    <p><b>📍 Grado:</b> 4to a 6to de Primaria</p>
                    <p><b>🧠 Pensamiento:</b> Innovación y Talento</p>
                    <p><b>🎯 Misión:</b> Presentar tu "Mochila Solar" y convencer al jurado con los mejores argumentos de venta.</p>
                </div>
                <button @click="faseGame = 'jugando'" class="btn-action" 
                        style="background: var(--startup-purple); color: white; padding: 18px; border-radius: 50px; border: none; width: 100%; cursor: pointer;">
                    EMPEZAR PRESENTACIÓN
                </button>
            </div>
        </div>
    </template>

    <template x-if="faseGame === 'resultado'">
        <div class="overlay">
            <div class="card-ui" :style="{ borderBottom: '8px solid ' + resColor }">
                <div style="font-size: 4rem; margin-bottom: 10px;" x-text="resIcon"></div>
                <h2 :style="{color: resColor}" x-text="resTitle"></h2>
                <p style="margin: 15px 0; font-weight: 600;" x-text="resMsg"></p>
                <button @click="reiniciar()" class="btn-action" 
                        style="background: #0f172a; color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; cursor: pointer;">
                    INTENTAR OTRA IDEA
                </button>
            </div>
        </div>
    </template>

    <header style="padding: 15px 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.6rem; font-weight: 900; color: #94a3b8;">
            <span>INTERÉS DEL JURADO</span>
            <span x-text="entusiasmo + '%'"></span>
        </div>
        <div class="meter-container">
            <div class="meter-fill" :style="{ width: entusiasmo + '%' }"></div>
        </div>
    </header>

    <main class="escenario">
        <div style="background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 0.65rem; font-weight: 900; margin-bottom: 15px; color: #a78bfa;">
            FASE <span x-text="pasoActual + 1"></span>: <span x-text="pasos[pasoActual].nombre"></span>
        </div>

        <div class="jury-box">
            <div class="jury-member" id="j1">👨‍⚖️</div>
            <div class="jury-member" id="j2">👩‍⚖️</div>
            <div class="jury-member" id="j3">🧐</div>
        </div>

        <div class="product-preview">
            <h3 style="color: var(--startup-purple); font-size: 1rem;">Mochila Solar Pro</h3>
            <p style="font-size: 0.75rem; color: #94a3b8;">"Energía limpia en tu espalda"</p>
        </div>

        <div class="options-grid">
            <template x-for="(opcion, index) in pasos[pasoActual].opciones" :key="index">
                <button class="option-btn" @click="mostrarFeedback(opcion)">
                    <span x-text="opcion.texto"></span>
                </button>
            </template>
        </div>

        <template x-if="mostrandoFeedback">
            <div class="feedback-pop" x-transition>
                <div style="font-size: 3rem; margin-bottom: 10px;" x-text="currentFeedback.icono"></div>
                <h3 :style="{color: currentFeedback.color}" x-text="currentFeedback.titulo"></h3>
                <p style="margin: 15px 0; font-size: 0.95rem; line-height: 1.5; color: #475569;" x-text="currentFeedback.msg"></p>
                
                <div style="background: #f1f5f9; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: 800;">
                    Impacto: <span :style="{color: currentFeedback.color}" x-text="currentFeedback.puntos > 0 ? '+' + currentFeedback.puntos : currentFeedback.puntos"></span> puntos
                </div>

                <button @click="siguientePaso()" class="btn-action" 
                        style="background: #1e293b; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; width: 100%;">
                    CONTINUAR PITCH →
                </button>
            </div>
        </template>
    </main>

    <script>
        function pitchGame() {
            return {
                faseGame: 'inicio',
                entusiasmo: 50,
                pasoActual: 0,
                mostrandoFeedback: false,
                currentFeedback: {},
                resIcon: '', resTitle: '', resMsg: '', resColor: '',

                pasos: [
                    {
                        nombre: "EL GANCHO",
                        opciones: [
                            { 
                                texto: "¿Estás cansado de que tu celular muera justo cuando más lo necesitas?", 
                                valor: 20, 
                                feedback: "¡Excelente! Empezar con una pregunta sobre un problema real conecta de inmediato con la audiencia.",
                                icono: '✅', titulo: '¡BUEN GANCHO!', color: '#22c55e'
                            },
                            { 
                                texto: "Hola, soy estudiante y hoy les traigo una mochila que tiene paneles solares.", 
                                valor: 5, 
                                feedback: "Es un inicio correcto pero poco emocionante. El jurado no se siente 'atrapado' por tu historia.",
                                icono: '⚠️', titulo: 'UN POCO PLANO', color: '#f59e0b'
                            },
                            { 
                                texto: "¡Esta mochila es la más barata del mercado y la mejor de todas!", 
                                valor: -10, 
                                feedback: "Cuidado. Si prometes demasiado sin explicar el porqué, el jurado sentirá que estás exagerando.",
                                icono: '❌', titulo: 'DEMASIADA PROMESA', color: '#ef4444'
                            }
                        ]
                    },
                    {
                        nombre: "EL VALOR",
                        opciones: [
                            { 
                                texto: "Nuestra mochila carga tu laptop y celular usando solo la luz del sol.", 
                                valor: 15, 
                                feedback: "Bien. Explicas la función principal claramente, aunque podrías ser más creativo.",
                                icono: '✅', titulo: 'CLARIDAD', color: '#22c55e'
                            },
                            { 
                                texto: "Carga tus sueños mientras cuidas el planeta con energía 100% limpia.", 
                                valor: 25, 
                                feedback: "¡Magnífico! Mezclaste un beneficio emocional (sueños) con un valor ético (planeta).",
                                icono: '🌟', titulo: '¡ARGUMENTO TOP!', color: '#6366f1'
                            },
                            { 
                                texto: "Tiene cables USB internos y el panel es de silicio monocristalino.", 
                                valor: 0, 
                                feedback: "Demasiados datos técnicos. El jurado quiere saber para qué sirve, no de qué está hecho exactamente.",
                                icono: '🧐', titulo: 'MUY TÉCNICO', color: '#64748b'
                            }
                        ]
                    },
                    {
                        nombre: "EL CIERRE",
                        opciones: [
                            { 
                                texto: "Únanse a la revolución solar. ¿Quién quiere probar la primera unidad?", 
                                valor: 20, 
                                feedback: "¡Perfecto! Un 'Llamado a la acción' invita al jurado a ser parte de tu éxito.",
                                icono: '🚀', titulo: '¡GRAN CIERRE!', color: '#22c55e'
                            },
                            { 
                                texto: "Y bueno, esto es todo. Gracias por escuchar mi presentación.", 
                                valor: -15, 
                                feedback: "¡Error común! Nunca termines pidiendo permiso o con timidez. ¡Debes terminar con fuerza!",
                                icono: '📉', titulo: 'FALTÓ FUERZA', color: '#ef4444'
                            }
                        ]
                    }
                ],

                mostrarFeedback(opcion) {
                    this.currentFeedback = {
                        msg: opcion.feedback,
                        puntos: opcion.valor,
                        icono: opcion.icono,
                        titulo: opcion.titulo,
                        color: opcion.color
                    };
                    this.entusiasmo = Math.min(100, Math.max(0, this.entusiasmo + opcion.valor));
                    this.mostrandoFeedback = true;

                    // Reacción visual del jurado
                    gsap.to(".jury-member", { 
                        y: opcion.valor > 0 ? -15 : 15, 
                        repeat: 1, yoyo: true, duration: 0.2 
                    });
                },

                siguientePaso() {
                    this.mostrandoFeedback = false;
                    if (this.pasoActual < this.pasos.length - 1) {
                        this.pasoActual++;
                    } else {
                        this.finalizar();
                    }
                },

                finalizar() {
                    if (this.entusiasmo >= 80) {
                        this.resIcon = '🏆'; this.resTitle = '¡IDEA FINANCIADA!';
                        this.resMsg = '¡Impresionante! Tu discurso fue lógico, emocionante y profesional.';
                        this.resColor = '#22c55e';
                        confetti({ particleCount: 150, spread: 70 });
                    } else if (this.entusiasmo >= 55) {
                        this.resIcon = '🤝'; this.resTitle = 'BUEN PITCH';
                        this.resMsg = 'El jurado tiene interés, pero necesitas pulir algunos argumentos.';
                        this.resColor = '#3b82f6';
                    } else {
                        this.resIcon = '❌'; this.resTitle = 'SIN INVERSIÓN';
                        this.resMsg = 'Tus argumentos no fueron lo suficientemente fuertes esta vez.';
                        this.resColor = '#ef4444';
                    }
                    this.faseGame = 'resultado';
                },

                reiniciar() {
                    this.entusiasmo = 50; this.pasoActual = 0;
                    this.mostrandoFeedback = false; this.faseGame = 'inicio';
                }
            }
        }
    </script>
</body>
</html>
