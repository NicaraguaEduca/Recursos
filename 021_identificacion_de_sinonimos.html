<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinónimos: Crisis en el Reactor</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #05070a;
            --neon-blue: #00f3ff;
            --neon-green: #0aff60;
            --neon-red: #ff2a2a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- FONDO ANIMADO --- */
        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%);
            background-size: 100% 4px;
            pointer-events: none; z-index: 10; opacity: 0.3;
        }

        /* --- CAPA DE APAGÓN (EFECTO INICIAL) --- */
        .blackout-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 1;
            transition: opacity 1s;
        }
        .blackout-layer.glitch { animation: glitchScreen 0.2s infinite; background: #220000; }
        .emergency-msg {
            font-family: 'Orbitron'; font-size: 4rem; color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red); display: none; text-align: center;
            animation: pulseText 0.5s infinite;
        }

        /* --- MODALES (INTRO Y FINAL) --- */
        .intro-modal {
            position: fixed; z-index: 2500;
            background: rgba(10, 15, 20, 0.95);
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 50px rgba(255, 42, 42, 0.3);
            padding: 40px; border-radius: 10px; text-align: center;
            max-width: 600px; display: none; 
            backdrop-filter: blur(10px);
            left: 50%; top: 50%; transform: translate(-50%, -50%); /* Centrado absoluto */
        }

        /* ESTILOS ESPECÍFICOS PARA EL MODAL FINAL */
        #end-modal {
            z-index: 5000; /* Por encima de los cables */
        }

        /* --- UI JUEGO --- */
        .game-ui {
            display: none; flex-direction: column; align-items: center; width: 95%; max-width: 900px;
            z-index: 20; position: relative;
        }

        .hud-header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        /* BARRA DE ESTABILIDAD (TIMER) */
        .stability-container {
            width: 60%; height: 20px; background: #333;
            border-radius: 10px; overflow: hidden; position: relative;
            box-shadow: inset 0 0 10px black; border: 1px solid #555;
        }
        .stability-bar {
            width: 100%; height: 100%; background: var(--neon-blue);
            width: 100%; transition: width 0.5s linear, background 0.3s;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .stability-label { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 0.9rem; line-height: 20px; text-shadow: 1px 1px 1px black; font-weight: bold; letter-spacing: 2px;}

        /* GRID CARTAS */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; }

        .card {
            aspect-ratio: 1; position: relative; perspective: 1000px; cursor: pointer;
        }
        .card-inner {
            width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d; position: relative;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.matched .card-inner { animation: pump 0.5s; }

        .front, .back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .front { background: rgba(20, 30, 40, 0.8); }
        .icon-reactor { font-size: 3rem; color: rgba(255,255,255,0.3); transition: 0.3s; }
        .card:hover .icon-reactor { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); transform: scale(1.1); }

        .back {
            transform: rotateY(180deg); background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-blue); color: white;
            font-family: 'Orbitron'; font-size: 1rem;
            text-align: center;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .card.matched .back {
            background: rgba(10, 255, 96, 0.2); border-color: var(--neon-green);
            color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green) inset;
        }

        /* --- ANIMACIÓN CABLES --- */
        .cable-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 4000;
            display: none; justify-content: center; align-items: center;
        }
        .cable-container {
            width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .cable-left, .cable-right {
            width: 45%; height: 40px; background: linear-gradient(90deg, #222, #444);
            position: absolute; display: flex; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .cable-left { 
            left: -50%; border-radius: 0 10px 10px 0; justify-content: flex-end;
            animation: connectLeft 2s forwards ease-in-out;
        }
        .cable-right { 
            right: -50%; border-radius: 10px 0 0 10px; justify-content: flex-start;
            animation: connectRight 2s forwards ease-in-out;
        }
        .connector-head {
            width: 30px; height: 60px; background: #888; border: 2px solid white;
            box-shadow: 0 0 15px var(--neon-blue); z-index: 2;
        }
        .energy-spark {
            position: absolute; width: 0; height: 0; background: radial-gradient(circle, white, var(--neon-blue), transparent);
            border-radius: 50%; opacity: 0; transform: translate(-50%, -50%);
            left: 50%; top: 50%; z-index: 5;
            animation: bigBang 0.5s 1.8s forwards;
        }

        @keyframes connectLeft { to { left: 5%; } }
        @keyframes connectRight { to { right: 5%; } }
        @keyframes bigBang {
            0% { width: 0; height: 0; opacity: 1; }
            50% { width: 200px; height: 200px; opacity: 1; }
            100% { width: 100vw; height: 100vh; opacity: 0; }
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); } }
        @keyframes glitchScreen { 
            0% { transform: translate(0); } 20% { transform: translate(-5px, 5px); } 
            40% { transform: translate(-5px, -5px); opacity: 0.8;} 60% { transform: translate(5px, 5px); } 
            80% { transform: translate(5px, -5px); opacity: 1;} 100% { transform: translate(0); } 
        }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pump { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.1); } 100% { transform: rotateY(180deg) scale(1); } }

        /* Botones */
        .btn-action {
            background: var(--neon-red); color: white; border: none;
            padding: 15px 40px; font-family: 'Orbitron'; font-size: 1.2rem;
            cursor: pointer; clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }
        .btn-action:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon-red); }
        
        /* Botón variante azul para reiniciar */
        .btn-restart {
            background: var(--neon-blue);
            color: #000;
            font-weight: bold;
        }
        .btn-restart:hover { box-shadow: 0 0 20px var(--neon-blue); }


        @media (max-width: 600px) { 
            .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } 
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="scanline"></div>

    <div class="cable-overlay" id="cable-scene">
        <div class="cable-container">
            <div class="cable-left"><div class="connector-head"></div></div>
            <div class="energy-spark"></div>
            <div class="cable-right"><div class="connector-head"></div></div>
        </div>
    </div>

    <div class="blackout-layer" id="blackout">
        <div style="color:var(--neon-blue); font-family:'Orbitron';" id="boot-text">SISTEMA ONLINE...</div>
        <div class="emergency-msg" id="emergency-text">¡FALLO CRÍTICO!</div>
    </div>

    <div class="intro-modal" id="intro-modal">
        <span class="material-symbols-rounded" style="font-size:4rem; color:var(--neon-red);">warning</span>
        <h1 style="font-family:'Orbitron'; margin:10px 0; color:var(--neon-red);">NÚCLEO INESTABLE</h1>
        <p style="font-size:1.2rem; color:#ccc; line-height:1.5;">
            El reactor ha perdido la sincronización. Tienes <span style="color:white; font-weight:bold;">60 segundos</span>.
            <br><br>
            Conecta los <strong>6 Pares de Sinónimos</strong> para estabilizar el sistema.
        </p>
        <button class="btn-action" onclick="startGame()">INICIAR EMERGENCIA</button>
    </div>

    <div class="intro-modal" id="end-modal" style="display:none;">
        <span class="material-symbols-rounded" id="end-icon" style="font-size:4rem;">check_circle</span>
        <h1 id="end-title" style="font-family:'Orbitron'; margin:10px 0;">RESULTADO</h1>
        <p id="end-msg" style="font-size:1.2rem; color:#ccc; line-height:1.5; margin-bottom: 30px;">
            Mensaje de resultado aquí.
        </p>
        <button class="btn-action btn-restart" onclick="location.reload()">REINICIAR SISTEMA</button>
    </div>

    <div class="game-ui" id="game-ui">
        <div class="hud-header">
            <div style="font-family:'Orbitron'; font-size:1.2rem; color:var(--neon-blue);">PROTOCOLO: <span style="color:white">SINÓNIMOS</span></div>
            <div class="stability-container">
                <div class="stability-bar" id="stability-bar"></div>
                <div class="stability-label">ESTABILIDAD DEL NÚCLEO</div>
            </div>
        </div>

        <div class="grid" id="grid"></div>
    </div>

<script>
    /* --- DATA: 6 PARES (12 CARTAS) --- */
    const synonyms = [
        { id: 1, wordA: "Rápido", wordB: "Veloz" },
        { id: 3, wordA: "Saltar", wordB: "Brincar" },
        { id: 4, wordA: "Oír", wordB: "Escuchar" },
        { id: 5, wordA: "Enorme", wordB: "Gigante" },
        { id: 6, wordA: "Calma", wordB: "Paz" },
        { id: 8, wordA: "Gafas", wordB: "Anteojos" }
    ];

    let hasFlipped = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let matches = 0;
    let timerInterval;
    let stability = 100;

    window.onload = () => {
        const blackout = document.getElementById('blackout');
        const bootText = document.getElementById('boot-text');
        const emergencyText = document.getElementById('emergency-text');

        setTimeout(() => {
            blackout.classList.add('glitch');
            bootText.style.display = 'none';
            emergencyText.style.display = 'block';
            document.body.style.animation = "glitchScreen 0.2s infinite";

            setTimeout(() => {
                document.body.style.animation = "none";
                blackout.style.opacity = 0;
                setTimeout(() => blackout.style.display = 'none', 1000);
                document.getElementById('intro-modal').style.display = 'block';
                confetti({ particleCount: 50, colors: ['#ff0000', '#ffaa00'], origin: { y: 0 } });
            }, 2000);
        }, 1500);
    };

    function startGame() {
        document.getElementById('intro-modal').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        initBoard();
        startTimer();
    }

    function startTimer() {
        const bar = document.getElementById('stability-bar');
        stability = 100;
        
        timerInterval = setInterval(() => {
            stability -= 0.5;
            bar.style.width = stability + "%";
            if (stability < 60) bar.style.backgroundColor = "yellow";
            if (stability < 30) {
                bar.style.backgroundColor = "red";
                bar.style.boxShadow = "0 0 20px red";
            }
            if (stability <= 0) gameOver();
        }, 300);
    }

    function initBoard() {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        
        let gameCards = [];
        synonyms.forEach(pair => {
            gameCards.push({ txt: pair.wordA, id: pair.id });
            gameCards.push({ txt: pair.wordB, id: pair.id });
        });
        
        // Algoritmo Fisher-Yates
        for (let i = gameCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [gameCards[i], gameCards[j]] = [gameCards[j], gameCards[i]];
        }

        gameCards.forEach(data => {
            const el = document.createElement('div');
            el.classList.add('card');
            el.dataset.id = data.id;
            el.innerHTML = `
                <div class="card-inner">
                    <div class="front"><span class="material-symbols-rounded icon-reactor">bolt</span></div>
                    <div class="back">${data.txt}</div>
                </div>
            `;
            el.addEventListener('click', flipCard);
            grid.appendChild(el);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlipped) {
            hasFlipped = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.id === secondCard.dataset.id;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        stability = Math.min(stability + 10, 100);
        document.getElementById('stability-bar').style.width = stability + "%";

        matches++;
        if (matches === synonyms.length) winGame();
        
        resetBoard();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [hasFlipped, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    /* --- NUEVAS FUNCIONES DE FINALIZACIÓN CON POPUP --- */

    function showEndPopup(type) {
        const modal = document.getElementById('end-modal');
        const icon = document.getElementById('end-icon');
        const title = document.getElementById('end-title');
        const msg = document.getElementById('end-msg');

        modal.style.display = 'block';

        if (type === 'win') {
            // Estilos para victoria
            modal.style.border = '2px solid var(--neon-green)';
            modal.style.boxShadow = '0 0 50px var(--neon-green)';
            icon.innerText = 'check_circle';
            icon.style.color = 'var(--neon-green)';
            title.innerText = 'ESTABILIZADO';
            title.style.color = 'var(--neon-green)';
            msg.innerText = 'El núcleo opera al 100%. Conexión neuronal restablecida.';
        } else {
            // Estilos para derrota
            modal.style.border = '2px solid var(--neon-red)';
            modal.style.boxShadow = '0 0 50px var(--neon-red)';
            icon.innerText = 'dangerous';
            icon.style.color = 'var(--neon-red)';
            title.innerText = 'FALLO CRÍTICO';
            title.style.color = 'var(--neon-red)';
            msg.innerText = 'El reactor se ha fundido. Evacuación inmediata.';
        }
    }

    function winGame() {
        clearInterval(timerInterval);
        
        // Animación de cables
        const cableScene = document.getElementById('cable-scene');
        cableScene.style.display = 'flex';

        setTimeout(() => {
            // Confeti
            confetti({ particleCount: 200, spread: 100, colors: ['#0aff60', '#00f3ff'] });
            
            // Mostrar POPUP (Reemplazo del Alert)
            setTimeout(() => {
                showEndPopup('win');
            }, 1000);
        }, 2200);
    }

    function gameOver() {
        clearInterval(timerInterval);
        document.body.style.background = "#220000";
        
        // Mostrar POPUP (Reemplazo del Alert)
        showEndPopup('lose');
    }
</script>
</body>
</html>
