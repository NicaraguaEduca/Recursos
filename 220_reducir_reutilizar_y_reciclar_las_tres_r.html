<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>♻️ Atrapa el Reciclaje - Las 3R</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(to bottom, #81D4FA 0%, #A5D6A7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .app-container {
            max-width: 950px;
            width: 100%;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 0 10px #4CAF50;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 6px solid #2E7D32;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PANTALLA INTRO ===== */
        .intro-screen {
            text-align: center;
            background: radial-gradient(circle, #E8F5E9 0%, #C8E6C9 100%);
        }
        .mascot {
            font-size: 7rem;
            margin-bottom: 0;
            animation: float 2s infinite ease-in-out;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        h1 {
            font-size: 3.5rem;
            color: #2E7D32;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #FFF;
            line-height: 1.1;
        }
        .instruction-box {
            background: white;
            border: 4px dashed #81C784;
            padding: 1.5rem;
            border-radius: 30px;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .highlight { color: #F57C00; font-weight: bold; }
        
        .btn-start {
            background: #4CAF50;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #2E7D32;
            transition: all 0.1s;
        }
        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #2E7D32;
        }

        /* ===== JUEGO ===== */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4CAF50;
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 6px 0 #2E7D32;
        }
        .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            flex-grow: 1;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: #F1F8E9;
            border-radius: 20px;
            padding: 20px;
            min-height: 350px;
            justify-content: space-between;
        }

        /* Visualización Central */
        .display-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .stage-emoji {
            font-size: 6rem;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 10px;
        }
        .stage-text {
            font-size: 1.8rem;
            color: #333;
            text-align: center;
            font-weight: bold;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            border: 4px dashed #BCAAA4;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            max-width: 90%;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Contenedores (Botones de las 3R) */
        .r-containers {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .r-btn {
            flex: 1;
            min-width: 150px;
            max-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            color: white;
            transition: all 0.1s;
        }
        .r-btn:active { transform: translateY(8px); box-shadow: none !important; }
        
        .btn-reducir { background: #FF9800; box-shadow: 0 8px 0 #EF6C00; }
        .btn-reutilizar { background: #2196F3; box-shadow: 0 8px 0 #1565C0; }
        .btn-reciclar { background: #4CAF50; box-shadow: 0 8px 0 #2E7D32; }

        .r-icon { font-size: 3rem; margin-bottom: 10px; }
        .r-label { font-size: 1.4rem; font-weight: bold; }

        /* Botones de Modos */
        .mode-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        .mode-btn {
            background: white; border: 4px solid #B0BEC5; padding: 12px 30px; font-size: 1.3rem;
            font-weight: bold; border-radius: 40px; cursor: pointer; color: #546E7A; box-shadow: 0 6px 0 #B0BEC5; transition: all 0.2s;
        }
        .mode-btn.active { background: #8E24AA; color: white; border-color: #6A1B9A; box-shadow: 0 6px 0 #4A148C; }

        /* ====== MODAL INVASIVO ====== */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center;
            z-index: 100; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; animation: popInModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popInModal { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .modal-content {
            background: #fff; padding: 2.5rem; border-radius: 30px; text-align: center;
            max-width: 90%; width: 550px; border: 8px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-content.info-reducir { border-color: #FF9800; }
        .modal-content.info-reutilizar { border-color: #2196F3; }
        .modal-content.info-reciclar { border-color: #4CAF50; }
        .modal-content.error { border-color: #F44336; }
        
        .modal-title { font-size: 2.5rem; margin-bottom: 1rem; }
        .info-reducir .modal-title { color: #FF9800; }
        .info-reutilizar .modal-title { color: #2196F3; }
        .info-reciclar .modal-title { color: #4CAF50; }
        .error .modal-title { color: #F44336; }
        
        .modal-text { font-size: 1.5rem; margin-bottom: 2rem; line-height: 1.5; color: #333; white-space: pre-line;}
        
        .modal-close {
            color: white; border: none; padding: 15px 50px; font-size: 1.5rem; border-radius: 50px;
            cursor: pointer; font-weight: bold; transition: transform 0.1s;
        }
        .modal-close:active { transform: translateY(6px); box-shadow: none !important; }
        .info-reducir .modal-close { background: #FF9800; box-shadow: 0 6px 0 #EF6C00; }
        .info-reutilizar .modal-close { background: #2196F3; box-shadow: 0 6px 0 #1565C0; }
        .info-reciclar .modal-close { background: #4CAF50; box-shadow: 0 6px 0 #2E7D32; }
        .error .modal-close { background: #F44336; box-shadow: 0 6px 0 #C62828; }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .mascot { font-size: 5rem; }
            .header { flex-direction: column; gap: 10px; }
            .status-text { font-size: 1.2rem; }
            .stage-emoji { font-size: 4rem; }
            .stage-text { font-size: 1.3rem; }
            .r-containers { gap: 10px; }
            .r-btn { min-width: 100px; padding: 10px; }
            .r-icon { font-size: 2rem; }
            .r-label { font-size: 1rem; }
            .mode-buttons { flex-direction: row; gap: 10px; }
            .mode-btn { font-size: 1rem; padding: 10px 15px; }
            .modal-content { padding: 1.5rem; }
            .modal-title { font-size: 1.8rem; }
            .modal-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ===== MODAL INVASIVO ===== -->
        <div id="feedbackModal" class="modal-overlay">
            <div id="modalBox" class="modal-content">
                <h2 id="modalTitle" class="modal-title">Título</h2>
                <p id="modalText" class="modal-text">Texto de explicación</p>
                <button id="modalBtn" class="modal-close">¡Entendido!</button>
            </div>
        </div>

        <!-- ===== INTRO ===== -->
        <div id="introScreen" class="screen intro-screen active">
            <div class="mascot">🌍💚</div>
            <h1>Las 3R del Planeta</h1>
            <div class="instruction-box">
                ¡Conviértete en un héroe de la Tierra!<br><br>
                Aprenderemos a:<br>
                📉 <span class="highlight">Reducir</span><br>
                🎨 <span class="highlight">Reutilizar</span><br>
                ♻️ <span class="highlight">Reciclar</span>
            </div>
            <button class="btn-start" id="startBtn">▶ ¡Salvar el Planeta!</button>
        </div>

        <!-- ===== JUEGO ===== -->
        <div id="gameScreen" class="screen">
            <div class="header">
                <div class="status-text" id="statusText">👨‍🏫 Toca un botón para aprender</div>
            </div>

            <div class="main-area">
                
                <!-- Escenario de Visualización -->
                <div class="display-stage" id="displayStage">
                    <div class="stage-emoji" id="stageEmoji">🌳</div>
                    <div class="stage-text" id="stageText">¡Cuidemos nuestro mundo!</div>
                </div>

                <!-- Controles / Botones de Respuestas -->
                <div class="r-containers">
                    <button class="r-btn btn-reducir" data-r="reducir">
                        <div class="r-icon">📉</div>
                        <div class="r-label">REDUCIR</div>
                    </button>
                    <button class="r-btn btn-reutilizar" data-r="reutilizar">
                        <div class="r-icon">🎨</div>
                        <div class="r-label">REUTILIZAR</div>
                    </button>
                    <button class="r-btn btn-reciclar" data-r="reciclar">
                        <div class="r-icon">♻️</div>
                        <div class="r-label">RECICLAR</div>
                    </button>
                </div>

            </div>

            <!-- Botones de modo -->
            <div class="mode-buttons">
                <button class="mode-btn active" id="btnTeach">👨‍🏫 Explicar</button>
                <button class="mode-btn" id="btnPractice">🎮 ¡A Jugar!</button>
            </div>
        </div>
    </div>

    <script>
        // ==== DATOS MODO PROFESOR ====
        const teachData = {
            'reducir': {
                emoji: '🛍️🚫',
                text: 'Llevar tu propia bolsa de tela para usar menos plástico.',
                modalTitle: '📉 REDUCIR',
                modalText: '**Significa usar menos cosas que generan basura.**\n\nPor ejemplo: Apagar la luz cuando sales del cuarto o llevar tu propia bolsita de tela al supermercado para no pedir bolsas de plástico.',
                modalClass: 'info-reducir'
            },
            'reutilizar': {
                emoji: '🥫🌻',
                text: 'Usar una lata vieja como maceta para flores.',
                modalTitle: '🎨 REUTILIZAR',
                modalText: '**Significa darle un uso nuevo a algo viejo.**\n\nPor ejemplo: En lugar de botar un calcetín sin par, ¡puedes convertirlo en un títere! O usar cajas de cartón para hacer un castillo.',
                modalClass: 'info-reutilizar'
            },
            'reciclar': {
                emoji: '🗑️♻️',
                text: 'Separar el papel, plástico y vidrio en sus basureros.',
                modalTitle: '♻️ RECICLAR',
                modalText: '**Significa separar la basura para crear cosas nuevas.**\n\nPor ejemplo: Tirar las botellas en el contenedor amarillo y el papel en el contenedor azul. ¡Las fábricas los derretirán para hacer botellas y papeles nuevos!',
                modalClass: 'info-reciclar'
            }
        };

        // ==== DATOS MODO PRÁCTICA ====
        let practiceQueue = [
            {
                emoji: '💧🚿',
                text: 'Cerrar la llave del agua mientras te lavas los dientes.',
                correctR: 'reducir',
                errorHint: 'Estás **gastando menos** agua para no desperdiciar. ¿Cuál de las 3R significa "usar menos"?'
            },
            {
                emoji: '🧦👾',
                text: 'Hacer un juguete divertido con un calcetín viejo.',
                correctR: 'reutilizar',
                errorHint: 'Le estás dando un **nuevo uso** a algo viejo en lugar de botarlo. ¿Cuál de las 3R significa "volver a usar"?'
            },
            {
                emoji: '📰➡️🔵',
                text: 'Tirar periódicos viejos en el basurero azul.',
                correctR: 'reciclar',
                errorHint: 'Estás **separando la basura** en el contenedor correcto para que hagan papel nuevo. ¿Cuál de las 3R es esta?'
            },
            {
                emoji: '💡🚫',
                text: 'Apagar la televisión cuando nadie la está viendo.',
                correctR: 'reducir',
                errorHint: 'Estás evitando gastar energía sin necesidad. Estás **usando menos** electricidad. ¿Qué R es?'
            },
            {
                emoji: '🏺✏️',
                text: 'Guardar tus colores adentro de un frasco de mermelada vacío.',
                correctR: 'reutilizar',
                errorHint: 'En vez de tirar el frasco, lo convertiste en un porta-lápices. Le diste una **nueva vida**. ¿Qué R es?'
            },
            {
                emoji: '🥤➡️🟡',
                text: 'Tirar una botella de plástico vacía en el basurero amarillo.',
                correctR: 'reciclar',
                errorHint: 'Estás poniendo el plástico en su **contenedor especial** para que la fábrica lo transforme. ¿Qué R es?'
            }
        ];

        let mode = 'teach';
        let currentPracticeIndex = 0;

        // Elementos DOM
        const screens = { intro: document.getElementById('introScreen'), game: document.getElementById('gameScreen') };
        const statusText = document.getElementById('statusText');
        const stageEmoji = document.getElementById('stageEmoji');
        const stageText = document.getElementById('stageText');
        
        // Modal Elements
        const modalOverlay = document.getElementById('feedbackModal');
        const modalBox = document.getElementById('modalBox');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalBtn = document.getElementById('modalBtn');

        // ==== AUDIO ====
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') { 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const oscN = audioCtx.createOscillator(); const gainN = audioCtx.createGain();
                    oscN.connect(gainN); gainN.connect(audioCtx.destination);
                    oscN.frequency.value = f; gainN.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.4);
                    oscN.start(audioCtx.currentTime + i * 0.1); oscN.stop(audioCtx.currentTime + i * 0.1 + 0.4);
                });
            }
        }

        // ==== LÓGICA MODAL ====
        function showModal(title, text, styleClass) {
            modalBox.className = `modal-content ${styleClass}`;
            modalTitle.textContent = title;
            modalText.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            modalOverlay.classList.add('active');
        }

        modalBtn.addEventListener('click', () => {
            playSound('pop');
            modalOverlay.classList.remove('active');
        });

        // ==== MANEJO DE CLICS EN LOS BOTONES (LAS 3R) ====
        document.querySelectorAll('.r-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rType = e.currentTarget.dataset.r;
                
                if (mode === 'teach') {
                    playSound('pop');
                    const data = teachData[rType];
                    showModal(data.modalTitle, data.modalText, data.modalClass);
                    // Actualizar el escenario después de cerrar el modal visualmente
                    stageEmoji.textContent = data.emoji;
                    stageText.textContent = data.text;
                    
                    // Pequeña animación
                    stageEmoji.style.animation = 'none';
                    stageEmoji.offsetHeight; // trigger reflow
                    stageEmoji.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

                } else if (mode === 'practice') {
                    checkAnswer(rType);
                }
            });
        });

        // ==== LÓGICA MODO PRÁCTICA ====
        function loadPracticeItem() {
            if (currentPracticeIndex >= practiceQueue.length) {
                statusText.textContent = "🌟 ¡Eres un héroe del planeta!";
                stageEmoji.textContent = "🏆🌍";
                stageText.textContent = "Has aprendido a usar las 3R a la perfección.";
                playSound('win');
                return;
            }

            const item = practiceQueue[currentPracticeIndex];
            statusText.textContent = "¿Qué R estamos usando aquí?";
            stageEmoji.textContent = item.emoji;
            stageText.textContent = item.text;
            
            stageEmoji.style.animation = 'none';
            stageEmoji.offsetHeight; 
            stageEmoji.style.animation = 'popIn 0.5s';
        }

        function checkAnswer(selectedR) {
            if (currentPracticeIndex >= practiceQueue.length) return;
            
            const item = practiceQueue[currentPracticeIndex];

            if (selectedR === item.correctR) {
                playSound('win');
                statusText.textContent = "¡Muy bien! Acertaste.";
                
                setTimeout(() => {
                    currentPracticeIndex++;
                    loadPracticeItem();
                }, 1500);
            } else {
                playSound('error');
                showModal("❌ ¡Oh no, piénsalo bien!", item.errorHint, 'error');
            }
        }

        // ==== CAMBIO DE MODOS ====
        function setMode(newMode) {
            mode = newMode;
            if (mode === 'teach') {
                statusText.textContent = "👨‍🏫 Toca un botón para aprender su significado.";
                document.getElementById('btnTeach').classList.add('active');
                document.getElementById('btnPractice').classList.remove('active');
                stageEmoji.textContent = "🌳";
                stageText.textContent = "¡Cuidemos nuestro mundo!";
            } else {
                document.getElementById('btnPractice').classList.add('active');
                document.getElementById('btnTeach').classList.remove('active');
                // Mezclar preguntas
                practiceQueue = practiceQueue.sort(() => Math.random() - 0.5);
                currentPracticeIndex = 0;
                loadPracticeItem();
            }
        }

        // ==== INICIALIZACIÓN ====
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!audioCtx) playSound('pop'); 
            screens.intro.classList.remove('active');
            screens.game.classList.add('active');
            setMode('teach');
        });

        document.getElementById('btnTeach').addEventListener('click', () => setMode('teach'));
        document.getElementById('btnPractice').addEventListener('click', () => setMode('practice'));

    </script>
</body>
</html>
