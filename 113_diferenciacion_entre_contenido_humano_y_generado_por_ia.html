<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Detective: Clasificador Ético</title>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #00ff9f;
            --neon-red: #ff0055;
            --neon-blue: #00d9ff;
            --bg-dark: #050a0e;
            --panel-bg: rgba(16, 25, 33, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- FONDO TECNOLÓGICO --- */
        .scanline {
            width: 100%; height: 2px; background: rgba(0, 255, 159, 0.1);
            position: fixed; top: 0; z-index: 1000; pointer-events: none;
            animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* --- PANTALLA DE INICIO --- */
        .pantalla-inicio {
            position: fixed; inset: 0; background: var(--bg-dark);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .card-inicio {
            background: var(--panel-bg); border: 2px solid var(--neon-blue);
            padding: 40px; border-radius: 15px; max-width: 650px;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
            text-align: center;
        }

        .titulo-glitch {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem;
            color: var(--neon-blue); margin-bottom: 20px;
            text-shadow: 2px 2px var(--neon-red);
        }

        .badge-info {
            background: rgba(0, 217, 255, 0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 5px 15px; border-radius: 5px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
            display: inline-block; margin-bottom: 15px;
        }

        /* --- CONTENEDOR DE JUEGO --- */
        .main-container {
            max-width: 900px; margin: 0 auto; padding: 40px 20px;
        }

        .header-stats {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; font-family: 'Share Tech Mono', monospace;
            background: var(--panel-bg); padding: 15px; border: 1px solid #333;
        }

        .evidencia-card {
            background: var(--panel-bg); border: 1px solid #333;
            border-radius: 20px; padding: 30px; position: relative;
            min-height: 480px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; transition: 0.5s;
            overflow: hidden;
        }

        .content-area {
            width: 100%; max-width: 700px; font-size: 1.2rem;
            line-height: 1.6; text-align: center; color: #fff;
            display: flex; flex-direction: column; align-items: center;
        }

        .contenedor-imagen {
            width: 100%; max-width: 550px; position: relative;
            background: #000; border-radius: 10px; border: 2px solid #444;
            margin-bottom: 20px; min-height: 250px; display: flex;
            align-items: center; justify-content: center;
        }

        .evidencia-imagen {
            width: 100%; max-height: 380px; object-fit: contain; 
            display: block;
        }

        .error-imagen {
            color: var(--neon-red); font-family: 'Share Tech Mono', monospace;
            text-align: center; padding: 20px;
        }

        .pistas-box {
            margin-top: 10px; padding: 15px; background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--neon-blue); border-radius: 10px; 
            font-size: 0.9rem; color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace; width: 100%;
        }

        /* --- BOTONES --- */
        .btn-panel {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;
        }

        .btn-ia, .btn-humano {
            padding: 20px; font-family: 'Orbitron', sans-serif; font-weight: bold;
            border: 2px solid; border-radius: 10px; cursor: pointer;
            transition: 0.3s; background: transparent; font-size: 1.1rem;
        }

        .btn-ia { color: var(--neon-red); border-color: var(--neon-red); }
        .btn-ia:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 20px var(--neon-red); }

        .btn-humano { color: var(--neon-green); border-color: var(--neon-green); }
        .btn-humano:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        .btn-next {
            background: var(--neon-blue); color: #000; border: none;
            padding: 12px 30px; border-radius: 5px; font-weight: bold;
            cursor: pointer; margin-top: 20px; font-family: 'Orbitron';
        }

        /* --- FEEDBACK --- */
        .feedback-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.96);
            border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 35px;
            text-align: center; z-index: 100;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="iaDetective()">

    <div class="scanline"></div>

    <!-- PANTALLA DE INICIO -->
    <template x-if="fase === 'inicio'">
        <div class="pantalla-inicio">
            <div class="card-inicio">
                <span class="badge-info">LABORATORIO DE ÉTICA DIGITAL</span>
                <h1 class="titulo-glitch">IA DETECTIVE</h1>
                
                <div style="text-align: left; margin: 20px 0; font-size: 0.95rem; border-left: 3px solid var(--neon-blue); padding-left: 15px; background: rgba(0,0,0,0.2); padding-top: 10px; padding-bottom: 10px;">
                    <p><b>🎯 Misión:</b> Identificar si el archivo es creación de una red neuronal o de un ser humano.</p>
                    <p><b>📖 Enfoque:</b> Pensamiento Crítico y Análisis Forense Digital.</p>
                    <p><b>🎓 Grado Sugerido:</b> 10-14 años.</p>
                </div>

                <p style="margin-bottom: 30px; color: #aaa; line-height: 1.4;">Bienvenido, Auditor. Se te han asignado <b>7 expedientes</b>. Las IAs imitan bien, pero cometen errores en la lógica y la física. ¡Encuéntralos!</p>
                
                <button @click="fase = 'jugando'" class="btn-humano" style="padding: 15px 40px; width: auto;">INICIAR AUDITORÍA</button>
            </div>
        </div>
    </template>

    <div class="main-container">
        <!-- STATS -->
        <div class="header-stats">
            <div>ARCHIVO: <span x-text="index + 1"></span> / <span x-text="casos.length"></span></div>
            <div :style="puntos > 0 ? 'color: var(--neon-green)' : ''">ACIERTOS: <span x-text="puntos"></span></div>
        </div>

        <!-- AREA DE EVIDENCIA -->
        <div class="evidencia-card">
            <div class="content-area" x-show="!respondido">
                <!-- Evidencia Visual (Imagen) -->
                <template x-if="casos[index].tipo === 'imagen'">
                    <div style="width: 100%;">
                        <div class="contenedor-imagen">
                            <!-- Sistema de carga con fallback -->
                            <img :src="casos[index].url" 
                                 class="evidencia-imagen" 
                                 @error="$el.parentElement.innerHTML = '<div class=\'error-imagen\'>[ ERROR DE CARGA: EVIDENCIA CORRUPTA O NO DISPONIBLE ]<br><small>Analiza basado en la descripción: ' + casos[index].pista + '</small></div>'"
                                 alt="Evidencia Forense">
                        </div>
                        <p class="pistas-box" x-text="'🔎 ANÁLISIS RECOMENDADO: ' + casos[index].pista"></p>
                    </div>
                </template>

                <!-- Evidencia de Texto -->
                <template x-if="casos[index].tipo === 'texto'">
                    <div style="width: 100%;">
                        <div style="padding: 30px; background: rgba(0,0,0,0.4); border-radius: 10px; border: 1px solid var(--neon-blue); position: relative; text-align: left;">
                            <span style="position: absolute; top: -10px; left: 20px; background: var(--bg-dark); padding: 0 10px; color: var(--neon-blue); font-size: 0.7rem; font-family: 'Share Tech Mono';">TEXTO_EXTRAIDO.LOG</span>
                            <p style="font-style: italic; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; color: #fff;" x-text="casos[index].contenido"></p>
                        </div>
                        <p class="pistas-box" style="margin-top: 20px;" x-text="'🔎 ANÁLISIS RECOMENDADO: ' + casos[index].pista"></p>
                    </div>
                </template>
            </div>

            <!-- FEEDBACK AL RESPONDER -->
            <div class="feedback-overlay" x-show="respondido" x-cloak x-transition>
                <div style="font-family: 'Share Tech Mono'; color: var(--neon-blue); margin-bottom: 10px;">-- RESULTADO DE ESCANEO --</div>
                <h2 :style="esCorrecto ? 'color: var(--neon-green)' : 'color: var(--neon-red)'" 
                    style="font-family: 'Orbitron'; font-size: 1.8rem; margin-bottom: 15px;"
                    x-text="esCorrecto ? '¡AUDITORÍA CORRECTA!' : 'DETECCIÓN ERRÓNEA'"></h2>
                
                <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid var(--neon-blue);">
                    <p style="font-size: 1.1rem; line-height: 1.5; text-align: left;" x-text="casos[index].explicacion"></p>
                </div>
                
                <button @click="siguienteCaso()" class="btn-next">ARCHIVAR Y CONTINUAR >></button>
            </div>
        </div>

        <!-- CONTROLES -->
        <div class="btn-panel" x-show="!respondido">
            <button class="btn-humano" @click="verificar('humano')">ORIGEN HUMANO</button>
            <button class="btn-ia" @click="verificar('ia')">ORIGEN ARTIFICIAL (IA)</button>
        </div>
    </div>

    <!-- RESULTADO FINAL -->
    <template x-if="fase === 'final'">
        <div class="pantalla-inicio">
            <div class="card-inicio">
                <h1 class="titulo-glitch">INFORME DE AUDITORÍA</h1>
                <p style="font-size: 2rem; margin-bottom: 15px; font-family: 'Orbitron'; color: var(--neon-green);">
                    EFECTIVIDAD: <span x-text="Math.round((puntos/casos.length)*100)"></span>%
                </p>
                
                <div style="background: rgba(0, 217, 255, 0.05); padding: 25px; border: 1px dashed var(--neon-blue); border-radius: 10px; margin-bottom: 25px; text-align: left;">
                    <p style="color: var(--neon-blue); margin-bottom: 10px; font-weight: bold; font-family: 'Orbitron';">CONCLUSIÓN ÉTICA:</p>
                    <p style="font-size: 0.95rem; line-height: 1.6;">Has completado el entrenamiento. En el mundo real, las IAs se usan para crear noticias falsas o engaños. Tu capacidad de analizar <b>detalles, lógica y contexto</b> es lo que te permite ser un ciudadano digital responsable. ¡Sigue dudando de lo que parece demasiado perfecto!</p>
                </div>

                <button @click="location.reload()" class="btn-humano" style="width: auto; padding: 15px 30px;">REINICIAR SISTEMA</button>
            </div>
        </div>
    </template>

    <script>
        function iaDetective() {
            return {
                fase: 'inicio',
                index: 0,
                puntos: 0,
                respondido: false,
                esCorrecto: false,
                casos: [
                    {
                        tipo: 'imagen',
                        // URL de una imagen artística compleja (IA habitual)
                        url: 'https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=600&auto=format&fit=crop', 
                        origen: 'ia',
                        pista: 'Mira la estructura del planeta y las estrellas. ¿Parecen astronómicamente correctas o decorativas?',
                        explicacion: 'Es IA. Aunque es impactante, las estrellas tienen patrones de brillo idénticos y la atmósfera del planeta se funde con el espacio de una forma que desafía las leyes de la física óptica. Es un paisaje "soñado" por una red neuronal.'
                    },
                    {
                        tipo: 'texto',
                        contenido: '"La inteligencia no es solo procesar datos, es sentir el peso de una decisión cuando el sol se oculta y saber que mañana, quizás, el error cometido hoy nos hará más sabios o más tristes."',
                        origen: 'humano',
                        pista: '¿El texto muestra una conexión entre emoción, tiempo y autoconciencia?',
                        explicacion: 'Es Humano. La reflexión sobre el peso emocional de un error y la incertidumbre del futuro (sabiduría vs tristeza) es una construcción filosófica muy ligada a la experiencia vivida.'
                    },
                    {
                        tipo: 'imagen',
                        // Imagen de una persona real en detalle
                        url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=600&auto=format&fit=crop',
                        origen: 'humano',
                        pista: 'Analiza los poros de la piel y las imperfecciones en el cuello o orejas.',
                        explicacion: 'Es Humano. Esta es una fotografía real. Los poros de la piel, las pequeñas arrugas asimétricas y la forma en que la luz rebota en los ojos muestran una complejidad biológica que la IA suele "suavizar" demasiado.'
                    },
                    {
                        tipo: 'texto',
                        contenido: 'Estimado usuario, su cuenta ha sido bloqueada debido a una actividad inusual. Para desbloquearla, por favor introduzca su contraseña en el enlace adjunto de inmediato para evitar la pérdida de datos.',
                        origen: 'ia',
                        pista: '¿Es un mensaje urgente, genérico y diseñado para causar una reacción rápida?',
                        explicacion: 'Es IA (o Bot). Este es un ejemplo clásico de Phishing generado automáticamente. Usa un tono de urgencia artificial y estructuras gramaticales perfectas pero despersonalizadas para engañar al usuario.'
                    },
                    {
                        tipo: 'imagen',
                        // Imagen de un objeto cotidiano con errores sutiles (IA)
                        url: 'https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=600&auto=format&fit=crop',
                        origen: 'ia',
                        pista: 'Observa si las sombras y los reflejos en el cristal coinciden con el entorno.',
                        explicacion: 'Es IA. En estas creaciones, los reflejos en las superficies curvas a menudo muestran un mundo que no existe alrededor del objeto, o las sombras apuntan en direcciones ligeramente contradictorias.'
                    },
                    {
                        tipo: 'texto',
                        contenido: 'Siete pasos para ser feliz: 1. Sonríe. 2. Bebe agua. 3. Haz ejercicio. 4. Duerme bien. 5. Sé agradecido. 6. Ayuda a otros. 7. Medita cada mañana.',
                        origen: 'ia',
                        pista: '¿Parece una lista de instrucciones genéricas extraídas de un manual?',
                        explicacion: 'Es IA. Es un formato de "lista de optimización" típico de los modelos de lenguaje. Es útil, pero carece de anécdotas, voz personal o profundidad; es simplemente una síntesis de datos web.'
                    },
                    {
                        tipo: 'texto',
                        contenido: 'Ayer mi perro intentó cazar una mosca y terminó chocando contra el espejo. Se quedó mirando su reflejo con una cara de duda tan humana que me reí durante diez minutos. Los animales son el espejo de nuestra propia torpeza.',
                        origen: 'humano',
                        pista: '¿Hay una anécdota específica, humor y una conclusión personal?',
                        explicacion: 'Es Humano. Las anécdotas situacionales con humor y una moraleja irónica son marcas distintivas de la comunicación humana basada en la observación del día a día.'
                    }
                ],

                verificar(eleccion) {
                    this.respondido = true;
                    if (eleccion === this.casos[this.index].origen) {
                        this.puntos++;
                        this.esCorrecto = true;
                        confetti({ 
                            particleCount: 100, 
                            spread: 70, 
                            origin: { y: 0.6 },
                            colors: ['#00ff9f', '#00d9ff', '#ffffff'] 
                        });
                    } else {
                        this.esCorrecto = false;
                    }
                },

                siguienteCaso() {
                    this.respondido = false;
                    if (this.index < this.casos.length - 1) {
                        this.index++;
                    } else {
                        this.fase = 'final';
                    }
                }
            }
        }
    </script>
</body>
</html>
