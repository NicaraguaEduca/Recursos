<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión: Sentidos Terrestres</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;700&display=swap');

        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            transition: background 1s ease;
        }

        /* --- FONDOS DINÁMICOS MEJORADOS --- */
        
        /* Nivel 1: Puntos suaves (Azul) */
        .bg-level-1 {
            background-color: #E3F2FD;
            background-image: radial-gradient(#90CAF9 20%, transparent 20%);
            background-size: 30px 30px;
        }

        /* Nivel 2: Cuadrícula "Mantel" (Naranja suave) */
        .bg-level-2 {
            background-color: #FFF3E0;
            background-image: 
                linear-gradient(90deg, rgba(255, 152, 0, 0.1) 1px, transparent 1px),
                linear-gradient(rgba(255, 152, 0, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Nivel 3: Rayas horizontales simples (Verde) */
        .bg-level-3 {
            background-color: #E8F5E9;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 19px, #A5D6A7 20px);
            background-size: 100% 20px;
        }

        /* UI SUPERIOR */
        #top-bar {
            width: 90%; max-width: 600px;
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 20px; border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .level-badge { font-family: 'Fredoka One', cursive; color: #555; font-size: 1.2rem; }
        
        #progress-container {
            width: 100px; height: 10px; background: #eee; border-radius: 5px; overflow: hidden;
        }
        #progress-fill {
            height: 100%; width: 0%; background: #4CAF50; transition: width 0.3s;
        }

        /* PERSONAJE (ZOG) */
        #narrator {
            margin-top: 10px; text-align: center;
            animation: float 3s ease-in-out infinite;
        }
        #zog-avatar { font-size: 4rem; filter: drop-shadow(0 5px 0 rgba(0,0,0,0.2)); transition: all 0.3s; }
        #dialogue-box {
            background: white; border: 3px solid #333; border-radius: 15px;
            padding: 10px 15px; position: relative; max-width: 80%;
            margin: -10px auto 10px auto; font-weight: bold; color: #444;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }
        #dialogue-box::after {
            content: ''; position: absolute; top: -10px; left: 50%; margin-left: -10px;
            border-width: 0 10px 10px; border-style: solid; border-color: #333 transparent; display: block; width: 0;
        }

        /* ZONA DE JUEGO */
        #game-area {
            flex-grow: 1; width: 100%; max-width: 600px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
        }

        #current-item {
            font-size: 6rem; cursor: grab;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
            transition: transform 0.2s;
        }
        #current-item:active { transform: scale(0.9) rotate(5deg); }

        .drop-zones {
            display: flex; gap: 15px; width: 95%; justify-content: center;
        }
        .zone {
            flex: 1; height: 140px;
            background: rgba(255,255,255,0.85); border: 3px dashed #999; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .zone-icon { font-size: 2.5rem; margin-bottom: 5px; }
        .zone-label { font-weight: bold; color: #555; font-size: 0.9rem; text-transform: uppercase; }

        /* MODALES */
        #story-modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #FFF; color: #333; padding: 30px; border-radius: 20px;
            max-width: 400px; animation: popIn 0.5s; border-bottom: 8px solid #ddd;
            position: relative;
        }
        .btn-action {
            background: #FF5722; color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer;
            margin-top: 20px; font-weight: bold;
            box-shadow: 0 5px 0 #E64A19; transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(5px); box-shadow: none; }

        /* ESTRELLAS DE VICTORIA */
        #stars-container {
            display: flex; justify-content: center; gap: 10px; margin: 15px 0;
        }
        .star {
            font-size: 3rem; color: #FFD700; opacity: 0;
            filter: drop-shadow(0 2px 0 #FFA000);
            animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .star:nth-child(1) { animation-delay: 0.1s; }
        .star:nth-child(2) { animation-delay: 0.2s; }
        .star:nth-child(3) { animation-delay: 0.3s; }
        .star:nth-child(4) { animation-delay: 0.4s; }
        .star:nth-child(5) { animation-delay: 0.5s; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes starPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .correct-anim { animation: successJump 0.5s; background: #C8E6C9 !important; border-color: #4CAF50 !important; }
        .wrong-anim { animation: shake 0.4s; background: #FFCDD2 !important; border-color: #F44336 !important; }
        @keyframes shake { 0%,100% {transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        @keyframes successJump { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }

    </style>
</head>
<body class="bg-level-1">

    <div id="top-bar">
        <div class="level-badge" id="level-title">NIVEL 1</div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span>Progreso:</span>
            <div id="progress-container"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div id="narrator">
        <div id="zog-avatar">👽</div>
        <div id="dialogue-box">¡Ayuda! ¿Esto se come o se escucha?</div>
    </div>

    <div id="game-area">
        <div id="current-item" onclick="playSound('pop')">❓</div>
        <div class="drop-zones" id="zones-container"></div>
    </div>

    <div id="story-modal">
        <div class="modal-content">
            <h1 id="modal-title" style="margin-top:0;">¡HOLA TERRÍCOLA!</h1>
            <div id="stars-container" style="display: none;"></div>
            <p id="modal-text" style="font-size: 1.1rem; line-height: 1.5;">Soy el Capitán Zog. Mi nave se averió y perdí mis sensores.<br><br>Necesito entrenar para entender vuestro planeta. ¿Me ayudas?</p>
            <button class="btn-action" onclick="startGame()">¡A LA MISIÓN!</button>
        </div>
    </div>

<script>
    /* --- CONFIGURACIÓN DE NIVELES --- */
    const levels = [
        {
            id: 1,
            title: "NIVEL 1: SALA DE MÚSICA",
            bgClass: "bg-level-1",
            intro: "Empecemos fácil. Separa lo que se VE de lo que se ESCUCHA.",
            categories: [
                { id: 'sight', icon: '👀', label: 'VISTA' },
                { id: 'hearing', icon: '👂', label: 'OÍDO' }
            ],
            items: [
                { emoji: "🌈", type: "sight" }, { emoji: "🎸", type: "hearing" },
                { emoji: "🔦", type: "sight" }, { emoji: "🥁", type: "hearing" },
                { emoji: "🖼️", type: "sight" }, { emoji: "🔔", type: "hearing" }
            ]
        },
        {
            id: 2,
            title: "NIVEL 2: LA COCINA",
            bgClass: "bg-level-2",
            intro: "¡Qué hambre! ¿Qué cosas son para PROBAR y cuáles para TOCAR?",
            categories: [
                { id: 'taste', icon: '👅', label: 'GUSTO' },
                { id: 'touch', icon: '✋', label: 'TACTO' }
            ],
            items: [
                { emoji: "🍦", type: "taste" }, { emoji: "⚽", type: "touch" },
                { emoji: "🍋", type: "taste" }, { emoji: "🧸", type: "touch" },
                { emoji: "🌶️", type: "taste" }, { emoji: "🏆", type: "touch" }
            ]
        },
        {
            id: 3,
            title: "NIVEL 3: EL PARQUE (CAOS)",
            bgClass: "bg-level-3",
            intro: "¡Eres un experto! Última prueba. En el parque hay DE TODO. Usa tus 3 sentidos principales. ¡No te equivoques!",
            categories: [
                { id: 'sight', icon: '👀', label: 'VISTA' },
                { id: 'smell', icon: '👃', label: 'OLFATO' },
                { id: 'hearing', icon: '👂', label: 'OÍDO' }
            ],
            items: [
                { emoji: "🧄", type: "smell" }, { emoji: "🌞", type: "sight" },
                { emoji: "⏰", type: "hearing" }, { emoji: "🦨", type: "smell" },
                { emoji: "🔭", type: "sight" }, { emoji: "🚑", type: "hearing" },
                { emoji: "💩", type: "smell" }, { emoji: "🎇", type: "sight" },
                { emoji: "🦗", type: "hearing" }, { emoji: "🚑", type: "hearing" }
            ]
        }
    ];

    let currentLevelIndex = 0;
    let currentQueue = [];
    let currentItem = null;
    let score = 0;
    let maxScore = 0;

    function startGame() {
        document.getElementById('story-modal').style.display = 'none';
        // Ocultar estrellas por si se reinicia
        document.getElementById('stars-container').innerHTML = '';
        document.getElementById('stars-container').style.display = 'none';
        loadLevel(currentLevelIndex);
    }

    function loadLevel(index) {
        const level = levels[index];
        document.body.className = level.bgClass;
        document.getElementById('level-title').innerText = level.title;
        document.getElementById('dialogue-box').innerText = level.intro;
        
        const zonesContainer = document.getElementById('zones-container');
        zonesContainer.innerHTML = '';
        level.categories.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'zone';
            div.id = `zone-${cat.id}`;
            div.onclick = () => checkAnswer(cat.id);
            div.innerHTML = `<div class="zone-icon">${cat.icon}</div><div class="zone-label">${cat.label}</div>`;
            zonesContainer.appendChild(div);
        });

        currentQueue = [...level.items].sort(() => Math.random() - 0.5);
        maxScore = level.items.length;
        score = 0;
        updateProgress();
        nextItem();
    }

    function nextItem() {
        if(currentQueue.length === 0) {
            handleLevelComplete();
            return;
        }
        currentItem = currentQueue.pop();
        const el = document.getElementById('current-item');
        el.style.transform = "scale(0)";
        setTimeout(() => {
            el.innerText = currentItem.emoji;
            el.style.transform = "scale(1)";
            playSound('pop');
        }, 200);
    }

    function checkAnswer(selectedType) {
        const zone = document.getElementById(`zone-${selectedType}`);
        
        if(selectedType === currentItem.type) {
            zone.classList.add('correct-anim');
            playSound('success');
            document.getElementById('dialogue-box').innerText = getRandomPraise();
            score++;
            updateProgress();
            setTimeout(() => {
                zone.classList.remove('correct-anim');
                nextItem();
            }, 600);
        } else {
            zone.classList.add('wrong-anim');
            playSound('error');
            document.getElementById('dialogue-box').innerText = "¡Oh no! Intenta de nuevo.";
            navigator.vibrate(200);
            setTimeout(() => {
                zone.classList.remove('wrong-anim');
            }, 500);
        }
    }

    function updateProgress() {
        const percent = (score / maxScore) * 100;
        document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function handleLevelComplete() {
        currentLevelIndex++;
        const modal = document.getElementById('story-modal');
        const title = document.getElementById('modal-title');
        const text = document.getElementById('modal-text');
        const btn = document.querySelector('.btn-action');
        const starsContainer = document.getElementById('stars-container');

        modal.style.display = 'flex';
        playSound('win');

        if(currentLevelIndex < levels.length) {
            title.innerText = "¡NIVEL COMPLETADO!";
            text.innerText = "Zog está aprendiendo rápido. Prepárate, el siguiente entorno es diferente.";
            btn.innerText = "SIGUIENTE NIVEL >>";
            btn.onclick = () => { modal.style.display = 'none'; loadLevel(currentLevelIndex); };
        } else {
            // --- PANTALLA FINAL CON ESTRELLAS ---
            title.innerText = "¡FELICIDADES CAMPEÓN!";
            title.style.color = "#FF9800"; // Título dorado
            
            // Generar 5 estrellas
            starsContainer.innerHTML = '';
            starsContainer.style.display = 'flex';
            for(let i=0; i<5; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = '⭐';
                starsContainer.appendChild(star);
            }

            text.innerHTML = "¡Lo lograste! Has completado todos los niveles y ayudado a Zog a entender la Tierra.<br><br><b>¡Eres un experto en los sentidos!</b>";
            
            btn.innerText = "VOLVER A JUGAR";
            btn.style.backgroundColor = "#4CAF50"; // Botón verde victoria
            
            // Zog celebra
            document.getElementById('zog-avatar').innerText = "🤩";
            document.getElementById('dialogue-box').innerText = "¡GRACIAS AMIGO!";

            btn.onclick = () => location.reload();
        }
    }

    function getRandomPraise() {
        const frases = ["¡Exacto!", "¡Muy bien!", "¡Correcto!", "¡Eso es!"];
        return frases[Math.floor(Math.random() * frases.length)];
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    function playSound(type) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        
        if (type === 'success') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } 
        else if (type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
        else if (type === 'pop') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
        else if (type === 'win') {
            playTone(523.25, now, 0.1); playTone(659.25, now+0.1, 0.1);
            playTone(783.99, now+0.2, 0.1); playTone(1046.50, now+0.3, 0.4);
        }
    }
    function playTone(freq, time, dur) {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, time); g.gain.linearRampToValueAtTime(0.01, time + dur);
        o.start(time); o.stop(time + dur);
    }
</script>
</body>
</html>
