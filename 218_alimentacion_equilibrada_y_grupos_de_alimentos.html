<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>🥗 El Plato Saludable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            /* Fondo de mantel de picnic rojo y blanco */
            background: 
                linear-gradient(45deg, rgba(255, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 0, 0, 0.1) 75%, rgba(255, 0, 0, 0.1)), 
                linear-gradient(45deg, rgba(255, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 0, 0, 0.1) 75%, rgba(255, 0, 0, 0.1));
            background-color: #fff;
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 6px solid #4CAF50;
        }

        .screen {
            display: none;
            width: 100%;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PANTALLA INTRO ===== */
        .intro-screen {
            text-align: center;
            background: radial-gradient(circle, #f1f8e9 0%, #c5e1a5 100%);
        }
        .mascot {
            font-size: 7rem;
            margin-bottom: 0;
            animation: float 2s infinite ease-in-out;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 3.5rem;
            color: #2e7d32;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #c5e1a5;
            line-height: 1.1;
        }
        .instruction-box {
            background: white;
            border: 4px dashed #8bc34a;
            padding: 1.5rem;
            border-radius: 30px;
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .highlight { color: #e65100; font-weight: bold; }
        
        .btn-start {
            background: #4CAF50;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #2e7d32;
            transition: all 0.1s;
        }
        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #2e7d32;
        }

        /* ===== PANTALLA JUEGO ===== */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ff9800;
            padding: 15px 25px;
            border-radius: 40px;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 0 #ef6c00;
        }
        .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            flex-grow: 1;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Controles Profesor */
        .teacher-controls {
            display: none;
            background: #fff3e0;
            border: 4px solid #ffb300;
            padding: 15px;
            border-radius: 30px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 700px;
        }
        .teacher-controls.active {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            animation: fadeIn 0.4s;
        }
        .btn-tool {
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-tool:active { transform: translateY(6px); box-shadow: none !important; }
        
        .btn-fv { background: #4CAF50; box-shadow: 0 6px 0 #2E7D32; }
        .btn-cer { background: #FFC107; box-shadow: 0 6px 0 #FF8F00; color: #333; }
        .btn-pro { background: #F44336; box-shadow: 0 6px 0 #C62828; }

        /* ====== EL PLATO ====== */
        .plate-container {
            position: relative;
            width: 65vmin;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .plate-rim {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 0 10px rgba(0,0,0,0.1);
            border: 10px solid #e0e0e0;
        }
        
        /* Zonas del plato */
        .zone {
            position: absolute;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 15px;
            font-size: 3vmin;
            transition: all 0.3s;
        }
        .zone-fv { /* Mitad Izquierda: Frutas y Verduras */
            width: 50%; height: 100%;
            left: 0; top: 0;
            border-radius: 100vmax 0 0 100vmax;
            background: #c8e6c9; /* Verde claro */
            border-right: 4px solid white;
        }
        .zone-cer { /* Cuarto Superior Derecho: Cereales */
            width: 50%; height: 50%;
            right: 0; top: 0;
            border-radius: 0 100vmax 0 0;
            background: #fff9c4; /* Amarillo claro */
            border-bottom: 4px solid white;
        }
        .zone-pro { /* Cuarto Inferior Derecho: Proteínas */
            width: 50%; height: 50%;
            right: 0; bottom: 0;
            border-radius: 0 0 100vmax 0;
            background: #ffccbc; /* Rojo/Naranja claro */
        }

        /* Elementos dentro del plato */
        .food-item {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 2px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }

        /* Efectos para interactuar en modo práctica */
        .practice-mode .zone { cursor: pointer; }
        .practice-mode .zone:hover { filter: brightness(0.9); transform: scale(1.02); z-index: 10;}
        
        /* Comida a clasificar */
        .current-food-box {
            display: none;
            margin-top: 10px;
            background: white;
            border: 4px dashed #9e9e9e;
            border-radius: 20px;
            padding: 10px 30px;
            font-size: 4rem;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: idle 2s infinite ease-in-out;
        }
        .current-food-box.active { display: flex; }

        /* Botones de Modos */
        .mode-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        .mode-btn {
            background: white;
            border: 4px solid #bdc3c7;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #7f8c8d;
            box-shadow: 0 6px 0 #bdc3c7;
            transition: all 0.1s;
        }
        .mode-btn:active { transform: translateY(6px); box-shadow: none; }
        .mode-btn.active {
            background: #2196f3; color: white; border-color: #1976d2; box-shadow: 0 6px 0 #0d47a1;
        }

        @media (max-width: 650px) {
            h1 { font-size: 2.2rem; }
            .header { flex-direction: column; text-align: center; gap: 10px; border-radius: 20px; }
            .status-text { font-size: 1.1rem; }
            .mode-buttons { gap: 10px; flex-direction: row; }
            .mode-btn { font-size: 1rem; padding: 10px 15px; }
            .btn-tool { font-size: 0.9rem; padding: 8px 10px; }
            .zone { font-size: 5vmin; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ===== INTRO ===== -->
        <div id="introScreen" class="screen intro-screen active">
            <div class="intro-content">
                <div class="mascot">👨‍🍳🥗</div>
                <h1>El Plato Sano</h1>
                <div class="instruction-box">
                    Para estar fuertes, nuestro plato debe estar <span class="highlight">equilibrado</span>.<br>
                    Mitad del plato: 🥦 Frutas y Verduras.<br>
                    Un cuarto: 🍞 Cereales (Energía).<br>
                    Un cuarto: 🍗 Proteínas (Fuerza).
                </div>
                <button class="btn-start" id="startBtn">▶ ¡A Cocinar!</button>
            </div>
        </div>

        <!-- ===== JUEGO ===== -->
        <div id="gameScreen" class="screen">
            <div class="header">
                <div class="status-text" id="statusText">👨‍🏫 El Profe Explica</div>
            </div>

            <div class="main-area">
                <!-- Panel del Profesor -->
                <div class="teacher-controls active" id="teacherControls">
                    <button class="btn-tool btn-fv" id="btnFv">🥦 Frutas y Verduras (Mitad)</button>
                    <button class="btn-tool btn-cer" id="btnCer">🍞 Cereales (Un cuarto)</button>
                    <button class="btn-tool btn-pro" id="btnPro">🍗 Proteínas (Un cuarto)</button>
                    <button class="btn-tool" style="background:#607D8B; box-shadow: 0 6px 0 #455A64;" id="btnClear">🧹 Limpiar</button>
                </div>

                <!-- Plato -->
                <div class="plate-container" id="plateContainer">
                    <div class="plate-rim">
                        <div class="zone zone-fv" id="zoneFv" data-type="fv"></div>
                        <div class="zone zone-cer" id="zoneCer" data-type="cer"></div>
                        <div class="zone zone-pro" id="zonePro" data-type="pro"></div>
                    </div>
                </div>

                <!-- Elemento a clasificar (Modo práctica) -->
                <div class="current-food-box" id="currentFoodBox">
                    <span id="currentEmoji">🍎</span>
                </div>

                <!-- Botones de modo -->
                <div class="mode-buttons">
                    <button class="mode-btn active" id="btnTeach">👨‍🏫 Explicar</button>
                    <button class="mode-btn" id="btnPractice">🎮 ¡Tu Turno!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==== DATOS DE LOS ALIMENTOS ====
        const foodData = {
            fv: ['🍎', '🥦', '🥕', '🍌', '🍇', '🥗', '🍓'],
            cer: ['🍞', '🍚', '🍝', '🥔', '🥖', '🌽'],
            pro: ['🍗', '🥚', '🥩', '🐟', '🧀', '🥛']
        };

        // Lista plana para el modo práctica
        let practiceQueue = [
            { emoji: '🥕', type: 'fv', name: 'Zanahoria (Verdura)' },
            { emoji: '🍗', type: 'pro', name: 'Pollo (Proteína)' },
            { emoji: '🍞', type: 'cer', name: 'Pan (Cereal)' },
            { emoji: '🍎', type: 'fv', name: 'Manzana (Fruta)' },
            { emoji: '🐟', type: 'pro', name: 'Pescado (Proteína)' },
            { emoji: '🍚', type: 'cer', name: 'Arroz (Cereal)' }
        ];
        let currentPracticeIndex = 0;
        let mode = 'teach';

        // Elementos DOM
        const screens = {
            intro: document.getElementById('introScreen'),
            game: document.getElementById('gameScreen')
        };
        const statusText = document.getElementById('statusText');
        const teacherControls = document.getElementById('teacherControls');
        const plateContainer = document.getElementById('plateContainer');
        const currentFoodBox = document.getElementById('currentFoodBox');
        const currentEmoji = document.getElementById('currentEmoji');
        
        const zones = {
            fv: document.getElementById('zoneFv'),
            cer: document.getElementById('zoneCer'),
            pro: document.getElementById('zonePro')
        };

        // ==== AUDIO ====
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') { 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99].forEach((f, i) => {
                    const oscN = audioCtx.createOscillator();
                    const gainN = audioCtx.createGain();
                    oscN.connect(gainN);
                    gainN.connect(audioCtx.destination);
                    oscN.frequency.value = f;
                    gainN.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
                    oscN.start(audioCtx.currentTime + i * 0.1);
                    oscN.stop(audioCtx.currentTime + i * 0.1 + 0.3);
                });
            }
        }

        // ==== LÓGICA MODO PROFESOR ====
        function fillZone(type, message) {
            playSound('pop');
            zones[type].innerHTML = ''; // Limpiar
            const items = foodData[type];
            items.forEach((emoji, i) => {
                setTimeout(() => {
                    const span = document.createElement('span');
                    span.className = 'food-item';
                    span.textContent = emoji;
                    zones[type].appendChild(span);
                    if(i % 2 === 0) playSound('pop');
                }, i * 100);
            });
            statusText.textContent = message;
        }

        function clearPlate() {
            Object.values(zones).forEach(z => z.innerHTML = '');
            statusText.textContent = "Plato vacío. ¡Construyamos una comida sana!";
            playSound('pop');
        }

        document.getElementById('btnFv').addEventListener('click', () => 
            fillZone('fv', '🍏 La mitad del plato: Nos dan vitaminas para no enfermarnos.'));
        document.getElementById('btnCer').addEventListener('click', () => 
            fillZone('cer', '🍞 Cereales: ¡Nos dan la energía para correr y jugar!'));
        document.getElementById('btnPro').addEventListener('click', () => 
            fillZone('pro', '🍗 Proteínas: Nos ayudan a crecer y hacer músculos fuertes.'));
        document.getElementById('btnClear').addEventListener('click', clearPlate);

        // ==== LÓGICA MODO PRÁCTICA ====
        function loadPracticeItem() {
            if (currentPracticeIndex >= practiceQueue.length) {
                statusText.textContent = "🌟 ¡Plato completado! Eres un experto en salud.";
                currentFoodBox.classList.remove('active');
                playSound('win');
                return;
            }
            const item = practiceQueue[currentPracticeIndex];
            currentEmoji.textContent = item.emoji;
            statusText.textContent = `¿Dónde va: ${item.name}? Toca el color correcto.`;
        }

        function handleZoneClick(e) {
            if (mode !== 'practice' || currentPracticeIndex >= practiceQueue.length) return;
            
            const clickedZone = e.currentTarget.dataset.type;
            const currentItem = practiceQueue[currentPracticeIndex];

            if (clickedZone === currentItem.type) {
                // Correcto
                playSound('win');
                const span = document.createElement('span');
                span.className = 'food-item';
                span.textContent = currentItem.emoji;
                zones[clickedZone].appendChild(span);
                
                currentPracticeIndex++;
                loadPracticeItem();
            } else {
                // Incorrecto
                playSound('error');
                currentFoodBox.style.transform = 'translateX(-10px)';
                setTimeout(() => currentFoodBox.style.transform = 'translateX(10px)', 100);
                setTimeout(() => currentFoodBox.style.transform = '', 200);
                statusText.textContent = "¡Uy no! Piensa bien... ¿Es verdura, cereal o proteína?";
            }
        }

        Object.values(zones).forEach(z => {
            z.addEventListener('click', handleZoneClick);
        });

        // ==== CAMBIO DE MODOS ====
        function setMode(newMode) {
            mode = newMode;
            clearPlate();
            
            if (mode === 'teach') {
                teacherControls.classList.add('active');
                currentFoodBox.classList.remove('active');
                plateContainer.classList.remove('practice-mode');
                statusText.textContent = "👨‍🏫 El Profe Explica";
                document.getElementById('btnTeach').classList.add('active');
                document.getElementById('btnPractice').classList.remove('active');
            } else {
                teacherControls.classList.remove('active');
                currentFoodBox.classList.add('active');
                plateContainer.classList.add('practice-mode');
                document.getElementById('btnPractice').classList.add('active');
                document.getElementById('btnTeach').classList.remove('active');
                
                // Mezclar la cola de práctica para que no sea siempre igual
                practiceQueue = practiceQueue.sort(() => Math.random() - 0.5);
                currentPracticeIndex = 0;
                loadPracticeItem();
            }
        }

        // ==== INICIALIZACIÓN ====
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!audioCtx) playSound('pop'); 
            screens.intro.classList.remove('active');
            screens.game.classList.add('active');
            setMode('teach');
        });

        document.getElementById('btnTeach').addEventListener('click', () => setMode('teach'));
        document.getElementById('btnPractice').addEventListener('click', () => setMode('practice'));

    </script>
</body>
</html>
