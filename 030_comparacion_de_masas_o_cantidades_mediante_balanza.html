<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Balanza del Mercado</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Titan+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #80DEEA;
            --wood-dark: #5D4037;
            --wood-light: #8D6E63;
            --metal: #607D8B;
            --highlight: #FFD600;
            --basket-color: #a1887f;
            --basket-shadow: #5d4037;
        }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(to bottom, var(--bg-color), #E0F7FA);
            user-select: none; touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- ESCENARIO DE MERCADO --- */
        .market-bg { position: absolute; width: 100%; height: 100%; bottom: 0; z-index: 0; }
        
        .stall-roof {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: repeating-linear-gradient(45deg, #EF5350 0, #EF5350 40px, #FFF 40px, #FFF 80px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 25;
        }
        
        .stall-post {
            position: absolute; top: 60px; bottom: 180px; width: 40px;
            background: repeating-linear-gradient(90deg, var(--wood-dark), var(--wood-dark) 5px, var(--wood-light) 5px, var(--wood-light) 10px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); z-index: 8;
        }
        .post-left { left: 20px; }
        .post-right { right: 20px; }

        .back-shelf {
            position: absolute; bottom: 250px; width: 100%; height: 30px;
            background: var(--wood-dark); z-index: 2;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .table {
            position: absolute; bottom: 0; width: 100%; height: 180px;
            background: #795548; border-top: 15px solid #5D4037; z-index: 9;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        /* --- PERSONAJE (DON PEPE) Y BURBUJA --- */
        #vendor-container {
            position: absolute; bottom: 150px; right: 5%;
            z-index: 40; display: flex; flex-direction: column; align-items: center;
        }
        
        .vendor-body { 
            font-size: 8rem; margin-top: -15px; z-index: 2;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }
        
        #vendor-bubble {
            position: relative; margin-bottom: 5px;
            width: 260px; background: white; border-radius: 20px; padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 3px solid #333;
            z-index: 3; opacity: 0; transform: scale(0); transform-origin: bottom center;
            font-size: 1rem; color: #333; pointer-events: none;
            transition: opacity 0.3s;
        }
        #vendor-bubble::after {
            content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            border-width: 15px 15px 0; border-style: solid; border-color: #333 transparent;
        }
        #vendor-bubble::before {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 13px 13px 0; border-style: solid; border-color: #FFF transparent; z-index: 1;
        }
        .bubble-title { color: #D84315; font-family: 'Titan One'; display: block; margin-bottom: 5px; font-size: 1.2rem;}

        /* --- BALANZA --- */
        #scale-system {
            position: absolute; bottom: 165px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 400px; z-index: 15;
        }
        .scale-base {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 25px; height: 260px; background: linear-gradient(to right, var(--metal), #B0BEC5, var(--metal));
            border-radius: 10px 10px 0 0; box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
        .scale-foot {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 140px; height: 25px; background: #455A64; border-radius: 15px 15px 0 0;
            border-top: 3px solid #B0BEC5;
        }
        .scale-beam {
            position: absolute; top: 140px; left: 50%; width: 500px; height: 20px;
            background: linear-gradient(to bottom, #546E7A, #37474F); margin-left: -250px; border-radius: 15px;
            transform-origin: center; transform: rotate(-20deg); box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .pan-container {
            position: absolute; top: 10px; width: 100px; transform-origin: top center;
        }
        .pan-rope {
            width: 4px; height: 110px; background: repeating-linear-gradient(45deg, #CFD8DC, #CFD8DC 5px, #B0BEC5 5px, #B0BEC5 10px);
            position: absolute; top: 0; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .rope-l { left: 5px; transform: rotate(12deg); transform-origin: top; }
        .rope-r { right: 5px; transform: rotate(-12deg); transform-origin: top; }
        
        .scale-plate {
            position: absolute; top: 105px; left: -30px; width: 160px; height: 55px;
            background: radial-gradient(ellipse at center, #FFF 40%, #B0BEC5 100%);
            border-radius: 0 0 80px 80px; border: 5px solid #546E7A; border-top: 2px solid #B0BEC5;
            display: flex; justify-content: center; align-items: flex-end;
            flex-wrap: wrap-reverse; padding-bottom: 12px; z-index: 20;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.3);
        }

        /* --- FRUTAS Y ANIMACIÓN --- */
        .fruit {
            width: 50px; height: 50px; display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; cursor: grab; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
            position: absolute; z-index: 100; margin: 0 1px;
        }
        .fruit:active { cursor: grabbing; transform: scale(1.2); z-index: 500 !important; }
        .fruit-docked {
            position: relative !important; top: auto !important; left: auto !important;
            transform: none !important; pointer-events: none; margin-bottom: -8px;
        }
        
        /* Animación Shake */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-10deg); }
            50% { transform: translateX(5px) rotate(10deg); }
            75% { transform: translateX(-5px) rotate(-10deg); }
            100% { transform: translateX(0); }
        }
        .error-shake {
            animation: shake 0.4s ease-in-out;
            filter: grayscale(0.8) sepia(0.5) hue-rotate(-50deg) !important;
        }

        /* --- INTERFAZ --- */
        #instruction-board {
            position: absolute; top: 80px; width: 90%; max-width: 550px;
            background: rgba(255,255,255,0.95); padding: 15px 25px; border-radius: 25px;
            text-align: center; border: 5px solid #D84315;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,243,224,1); 
            z-index: 50;
        }
        
        h2 { 
            margin: 0 0 10px 0; color: #D84315; 
            font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 2rem;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5); 
        }
        
        p { margin: 10px 0 0 0; color: #4E342E; font-size: 1.2rem; font-weight: bold; }
        .highlight { color: #D84315; font-family: 'Titan One'; background: #FFE0B2; padding: 2px 8px; border-radius: 8px; border: 2px solid white; box-shadow: 0 3px 5px rgba(0,0,0,0.1); }

        /* CANASTAS */
        #baskets-area {
            position: absolute; bottom: 15px; width: 100%; height: 140px;
            display: flex; justify-content: center; gap: 60px; z-index: 60;
        }
        .basket {
            width: 120px; height: 95px;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px),
                repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(0,0,0,0.05) 5px, rgba(0,0,0,0.05) 10px),
                var(--basket-color);
            border-radius: 5px 5px 25px 25px;
            border-top: 8px solid var(--basket-shadow);
            box-shadow: 
                inset 0 -15px 30px rgba(0,0,0,0.4), 
                0 10px 15px rgba(0,0,0,0.4); 
            display: flex; justify-content: center; padding-top: 10px; position: relative;
        }
        .basket::before {
             content: ''; position: absolute; top: -20px; left: 10%; width: 80%; height: 40px;
             border: 6px solid var(--basket-shadow); border-bottom: none; border-radius: 40px 40px 0 0;
             z-index: -1;
        }
        .basket-label {
            position: absolute; bottom: 5px; font-weight: bold; color: white; font-family: 'Fredoka';
            background: rgba(93, 64, 55, 0.9); padding: 4px 15px; border-radius: 20px; font-size: 1rem;
            border: 1px solid #8D6E63; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #next-btn {
            position: absolute; bottom: 30px; right: 30px;
            background: linear-gradient(to bottom, #66BB6A, #43A047); border: none; padding: 12px 30px;
            color: white; font-family: 'Titan One'; font-size: 1.3rem; text-shadow: 0 2px 2px rgba(0,0,0,0.3);
            border-radius: 40px; display: none; cursor: pointer; z-index: 210;
            box-shadow: 0 8px 0 #2E7D32, 0 15px 20px rgba(0,0,0,0.3); border: 3px solid white;
        }
        #next-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #2E7D32; }

        @media (max-width: 768px) {
            #scale-system { transform: translateX(-50%) scale(0.7); bottom: 190px; width: 100%; }
            .stall-post { width: 25px; } .post-left { left: 5px; } .post-right { right: 5px; }
            #vendor-container { transform: scale(0.75); right: -30px; bottom: 140px; }
            #vendor-bubble { width: 220px; font-size: 0.95rem; }
            #instruction-board { top: 65px; font-size: 0.9rem; padding: 10px 15px; width: 85%; }
            h2 { font-size: 1.6rem; }
            .fruit { width: 60px; height: 60px; font-size: 2.8rem; }
            .scale-plate { width: 150px; }
            #baskets-area { gap: 20px; }
            #next-btn { bottom: 20px; right: 20px; font-size: 1.1rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>

<div class="stall-roof"></div>
<div class="stall-post post-left"></div>
<div class="stall-post post-right"></div>
<div class="market-bg">
    <div class="back-shelf"></div>
    <div class="table"></div>
</div>

<div id="vendor-container">
    <div id="vendor-bubble">
        <span class="bubble-title">¡Atento!</span>
        <span id="bubble-text">...</span>
    </div>
    <div class="vendor-body">👨‍🌾</div>
</div>

<div id="instruction-board">
    <h2>⚖️ LA BALANZA MÁGICA</h2>
    <p id="instr-text"></p>
</div>

<div id="scale-system">
    <div class="scale-foot"></div>
    <div class="scale-base"></div>
    <div class="scale-beam" id="beam">
        <div class="pan-container" style="left: 0;" id="pan-left-container">
            <div class="pan-rope rope-l"></div> <div class="pan-rope rope-r"></div>
            <div class="scale-plate" id="plate-left"></div>
        </div>
        <div class="pan-container" style="right: 0;" id="pan-right-container">
            <div class="pan-rope rope-l"></div> <div class="pan-rope rope-r"></div>
            <div class="scale-plate" id="plate-right"></div>
        </div>
    </div>
</div>

<div id="baskets-area"></div>
<button id="next-btn" onclick="nextLevel()">Siguiente Pedido ➡</button>

<script>
    let levelData = { fruitA: {icon:'🍎', count:3, name:'Manzanas'}, fruitB: {icon:'🍌', count:2, name:'Bananos'} };
    // Contadores para controlar el orden
    let currentCountFirst = 0; // Controla el primer grupo pedido (Fruit B)
    let currentCountSecond = 0; // Controla el segundo grupo pedido (Fruit A)
    let totalTarget = 0;
    let isComplete = false;

    window.onload = function() { initLevel(); };

    function initLevel() {
        isComplete = false;
        currentCountFirst = 0;
        currentCountSecond = 0;
        totalTarget = levelData.fruitA.count + levelData.fruitB.count;

        // Reset UI
        gsap.to("#vendor-bubble", { opacity: 0, scale: 0 });
        document.querySelector('.vendor-body').innerText = "👨‍🌾";
        document.querySelector('.bubble-title').innerText = "¡Atento!";
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('plate-left').innerHTML = '';
        document.getElementById('plate-right').innerHTML = '';
        document.getElementById('baskets-area').innerHTML = '';
        
        updateBalanceVisuals();

        // 1. Llenar Plato Referencia (Izquierdo)
        for(let i=0; i<levelData.fruitA.count; i++) addStaticFruit('plate-left', levelData.fruitA.icon);
        for(let i=0; i<levelData.fruitB.count; i++) addStaticFruit('plate-left', levelData.fruitB.icon);

        // 2. Instrucción: Pedimos primero B y luego A
        const instrHTML = `Tengo <span class="highlight">${levelData.fruitA.count} ${levelData.fruitA.icon}</span> y <span class="highlight">${levelData.fruitB.count} ${levelData.fruitB.icon}</span>.<br>
                           Pon en el otro lado <span class="highlight">${levelData.fruitB.count} ${levelData.fruitB.icon}</span> y <span class="highlight">${levelData.fruitA.count} ${levelData.fruitA.icon}</span>.`;
        document.getElementById('instr-text').innerHTML = instrHTML;

        // 3. Crear Canastas
        createDraggables(levelData.fruitB, 'basket-1'); // Esta es la que pedimos primero
        createDraggables(levelData.fruitA, 'basket-2'); // Esta es la segunda
    }

    function addStaticFruit(plateId, icon) {
        const el = document.createElement('div');
        el.className = 'fruit fruit-docked';
        el.innerText = icon;
        document.getElementById(plateId).appendChild(el);
        gsap.from(el, { scale: 0, duration: 0.3, ease: "back.out" });
    }

    function createDraggables(fruitObj, basketId) {
        const basket = document.createElement('div');
        basket.className = 'basket';
        basket.innerHTML = `<div class="basket-label">${fruitObj.name}</div>`;
        for(let i=0; i<fruitObj.count; i++) {
            const f = document.createElement('div');
            f.className = 'fruit';
            f.innerText = fruitObj.icon;
            // IMPORTANTE: El ID lleva el nombre para identificar qué fruta es
            f.id = `drag-${fruitObj.name}-${i}`;
            f.style.position = 'absolute';
            f.style.bottom = (20 + i*7) + 'px'; 
            f.style.left = (35 + (Math.random()*10 - 5)) + 'px';
            basket.appendChild(f);
        }
        document.getElementById('baskets-area').appendChild(basket);
        initDraggable(basket);
    }

    function initDraggable(container) {
        const fruits = container.querySelectorAll('.fruit');
        Draggable.create(fruits, {
            type: "x,y", edgeResistance: 0.65, bounds: "body", inertia: true,
            onPress: function() { this.target.style.zIndex = 1000; gsap.to(this.target, { scale: 1.4 }); },
            onRelease: function() { gsap.to(this.target, { scale: 1 }); checkDrop(this.target); }
        });
    }

    // --- MANEJO DE ERRORES CON MENSAJE PERSONALIZADO ---
    function showErrorState(message) {
        const vendorBody = document.querySelector('.vendor-body');
        const bubble = document.getElementById('vendor-bubble');
        const bubbleText = document.getElementById('bubble-text');

        // 1. Cambiar cara a Pensativo
        vendorBody.innerText = "🤔"; 
        gsap.to(vendorBody, { scale: 1.1, duration: 0.2, yoyo: true, repeat: 1 });

        // 2. Mostrar mensaje en burbuja
        bubbleText.innerText = message;
        gsap.to(bubble, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out" });
        
        // 3. Ocultar después de 2 segundos
        setTimeout(() => {
            vendorBody.innerText = "👨‍🌾"; // Volver a cara normal
            gsap.to(bubble, { opacity: 0, scale: 0, duration: 0.3 });
        }, 2000);
    }

    function checkDrop(element) {
        if(isComplete) return;
        const plateRight = document.getElementById('plate-right');
        const plateRect = plateRight.getBoundingClientRect();
        const elRect = element.getBoundingClientRect();

        // Verificar si soltó SOBRE el plato
        const isOnPlate = (elRect.centerX > plateRect.left && elRect.centerX < plateRect.right &&
                           elRect.centerY > plateRect.top && elRect.centerY < plateRect.bottom + 20);

        if (isOnPlate) {
            // --- LÓGICA DE ORDEN ---
            // Extraer nombre de la fruta del ID (ej: drag-Manzanas-0 -> Manzanas)
            const draggedFruitName = element.id.split('-')[1];
            
            // ¿Qué fruta esperamos ahora?
            // Primero esperamos FruitB (según instrucción). Si ya completamos B, esperamos A.
            const expectingFirstGroup = (currentCountFirst < levelData.fruitB.count);
            
            let isCorrectMove = false;
            let errorMsg = "";

            if (expectingFirstGroup) {
                // Estamos esperando el Primer Grupo (FruitB)
                if (draggedFruitName === levelData.fruitB.name) {
                    isCorrectMove = true;
                    currentCountFirst++;
                } else {
                    isCorrectMove = false;
                    errorMsg = `Debes colocar primero: ${levelData.fruitB.name}`;
                }
            } else {
                // Ya terminamos el primero, ahora cualquier cosa válida es aceptada (que será FruitA)
                isCorrectMove = true;
                currentCountSecond++;
            }

            if (isCorrectMove) {
                // MOVIMIENTO CORRECTO
                Draggable.get(element).kill();
                element.style.cssText = "";
                element.className = 'fruit fruit-docked';
                plateRight.appendChild(element);
                gsap.from(element, { scale: 1.6, y: -30, duration: 0.4, ease: "bounce.out" });
                updateBalanceVisuals();

                // Verificar victoria
                if((currentCountFirst + currentCountSecond) >= totalTarget) setTimeout(showWin, 800);

            } else {
                // ERROR DE ORDEN O TIPO
                showErrorState(errorMsg);
                element.classList.add('error-shake');
                setTimeout(() => element.classList.remove('error-shake'), 400);
                gsap.to(element, { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power2.out" });
            }

        } else {
            // ERROR: NO ATINÓ AL PLATO (Error mecánico, no lógico)
            gsap.to(element, { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power2.out" });
        }
    }

    function updateBalanceVisuals() {
        const totalPlaced = currentCountFirst + currentCountSecond;
        const progress = totalPlaced / totalTarget; 
        const targetAngle = -20 + (progress * 20);
        gsap.to("#beam", { rotation: targetAngle, duration: 1.2, ease: "elastic.out(1, 0.6)" });
        gsap.to(".pan-container", { rotation: -targetAngle, duration: 1.2, ease: "elastic.out(1, 0.6)" });
    }

    function showWin() {
        isComplete = true;
        confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors: ['#FFD54F', '#66BB6A', '#42A5F5'] });
        document.getElementById('next-btn').style.display = 'block';
        gsap.from("#next-btn", { scale: 0, duration: 0.4, ease: "back.out" });

        const A = levelData.fruitA;
        const B = levelData.fruitB;
        
        document.querySelector('.bubble-title').innerText = "¡Mismo peso!";
        const explanation = `¿Viste? <b>${A.count}</b> ${A.name} más <b>${B.count}</b> ${B.name} pesan igual que <b>${B.count}</b> ${B.name} más <b>${A.count}</b> ${A.name}.<br>¡El orden no altera el total!`;
        
        document.getElementById('bubble-text').innerHTML = explanation;
        gsap.to("#vendor-bubble", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" });
    }

    function nextLevel() {
        const fruits = [
            {icon:'🍇', name:'Uvas'}, {icon:'🍊', name:'Naranjas'}, 
            {icon:'🍋', name:'Limones'}, {icon:'🍉', name:'Sandías'},
            {icon:'🍓', name:'Fresas'}, {icon:'🍍', name:'Piñas'},
            {icon:'🥝', name:'Kiwis'}, {icon:'🥥', name:'Cocos'}
        ];
        fruits.sort(() => Math.random() - 0.5);
        
        const c1 = Math.floor(Math.random() * 3) + 2; 
        const c2 = Math.floor(Math.random() * 3) + 2;

        levelData = {
            fruitA: { icon: fruits[0].icon, count: c1, name: fruits[0].name },
            fruitB: { icon: fruits[1].icon, count: c2, name: fruits[1].name }
        };
        initLevel();
    }

    if (!DOMRect.prototype.centerX) {
        Object.defineProperty(DOMRect.prototype, 'centerX', { get: function() { return this.left + this.width / 2; } });
        Object.defineProperty(DOMRect.prototype, 'centerY', { get: function() { return this.top + this.height / 2; } });
    }
</script>

</body>
</html>
