<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>♞ El Salto del Caballo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #1cb5e0 0%, #000851 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 8px #ffeb3b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 6px solid #f39c12;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PANTALLA INTRO ===== */
        .intro-screen {
            text-align: center;
            background: radial-gradient(circle, #fffbe0 0%, #ffdf80 100%);
        }
        .big-knight {
            font-size: 8rem;
            color: #2c3e50;
            margin-bottom: 0;
            text-shadow: 4px 4px 0px #f39c12;
            animation: idle 2s infinite ease-in-out;
        }
        @keyframes idle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 3.5rem;
            color: #e74c3c;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #f1c40f;
            line-height: 1.1;
        }
        .instruction-box {
            background: white;
            border: 4px dashed #3498db;
            padding: 1.5rem;
            border-radius: 30px;
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .highlight {
            color: #e74c3c;
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
            margin: 10px 0;
        }
        .btn-start {
            background: #2ecc71;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #27ae60;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #27ae60;
        }

        /* ===== PANTALLA JUEGO ===== */
        .game-screen {
            background: #e0f7fa;
            padding: 1rem;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #8e44ad;
            padding: 15px 25px;
            border-radius: 40px;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 0 #732d91;
        }
        .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1c40f;
            text-align: center;
            flex-grow: 1;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Controles Profesor */
        .teacher-controls {
            display: none;
            background: #fff9c4;
            border: 4px solid #fbc02d;
            padding: 15px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 60vmin;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .teacher-controls.active {
            display: block;
            animation: fadeIn 0.4s;
        }
        .btn-demo {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 0 #e65100;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-demo:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        /* Tablero */
        .board-container {
            width: 100%;
            max-width: 60vmin;
            aspect-ratio: 1/1;
            background: #4a3b32;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 6px solid #2e231d;
            position: relative; /* Importante para que el caballo flote encima */
        }

        .cell {
            background: #f0d9b5; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .cell.dark {
            background: #b58863; 
        }
        
        /* Pieza: Ahora es flotante y se desliza */
        .knight {
            position: absolute;
            width: 12.5%; /* 1/8 del tablero */
            height: 12.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7vmin;
            color: #1a1a1a;
            filter: drop-shadow(4px 6px 4px rgba(0,0,0,0.6));
            pointer-events: none; /* Los clics atraviesan el caballo hacia la casilla */
            transition: top 0.5s ease-in-out, left 0.5s ease-in-out; /* Esta línea hace la magia del deslizamiento */
            z-index: 20;
        }
        .knight-icon {
            animation: idle 2s infinite ease-in-out; 
        }

        /* Estilos de Destino y Ruta (Animación) */
        .cell.target {
            cursor: pointer;
        }
        .cell.target::before {
            content: '⭐';
            font-size: 4vmin;
            position: absolute;
            animation: pulse 1s infinite;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Ruta Animada "1, 2, Giro" */
        .cell.trail-1::after, .cell.trail-2::after, .cell.trail-3::after {
            position: absolute;
            font-family: 'Comic Sans MS', sans-serif;
            font-weight: bold;
            font-size: 3.5vmin;
            color: white;
            width: 7vmin;
            height: 7vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            z-index: 10;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .cell.trail-1::after { content: '1'; background: #3498db; }
        .cell.trail-2::after { content: '2'; background: #3498db; }
        .cell.trail-3::after { content: '¡Giro!'; background: #e74c3c; font-size: 2vmin; border-radius: 15px; width: auto; padding: 0 10px;}

        @keyframes popIn {
            from { transform: scale(0) rotate(-10deg); }
            to { transform: scale(1) rotate(0deg); }
        }

        /* Botones de Modos */
        .mode-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        .mode-btn {
            background: white;
            border: 4px solid #bdc3c7;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #7f8c8d;
            box-shadow: 0 6px 0 #bdc3c7;
            transition: all 0.1s;
        }
        .mode-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .mode-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 6px 0 #1f618d;
        }

        /* Responsive */
        @media (max-width: 650px) {
            h1 { font-size: 2.2rem; }
            .board-container { max-width: 85vmin; }
            .knight { font-size: 9vmin; }
            .header { flex-direction: column; text-align: center; gap: 10px; border-radius: 20px; }
            .status-text { font-size: 1.1rem; }
            .mode-buttons { gap: 10px; flex-direction: row; }
            .mode-btn { font-size: 1rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ===== INTRO ===== -->
        <div id="introScreen" class="screen intro-screen active">
            <div class="intro-content">
                <div class="big-knight">♞</div>
                <h1>Aprende el Caballo</h1>
                <div class="instruction-box">
                    ¡El caballo es un acróbata y le encanta saltar! 🤸‍♂️<br>
                    Para moverse, siempre dibuja una <strong>letra "L"</strong>.
                    <span class="highlight">2 pasos rectos y 1 a un lado.</span>
                </div>
                <button class="btn-start" id="startBtn">▶ ¡Empezar Clase!</button>
            </div>
        </div>

        <!-- ===== JUEGO ===== -->
        <div id="gameScreen" class="screen game-screen">
            <div class="header">
                <div class="status-text" id="statusText">👨‍🏫 ¡El Profe Explica!</div>
            </div>

            <div class="main-area">
                <!-- Panel del Profesor -->
                <div class="teacher-controls active" id="teacherControls">
                    <p style="color:#d35400; font-size: 1.2rem; font-weight:bold; margin-bottom: 5px;" id="demoText">Presiona el botón para ver cómo dibuja la "L" mágica ✨</p>
                    <button class="btn-demo" id="btnDemo">👀 Ver Demostración</button>
                </div>

                <!-- Tablero -->
                <div class="board-container" id="board"></div>

                <!-- Botones de modo -->
                <div class="mode-buttons">
                    <button class="mode-btn active" id="btnTeach">👨‍🏫 El Profe Explica</button>
                    <button class="mode-btn" id="btnPractice">🎮 ¡Tu Turno!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let knightPos = { row: 4, col: 3 };
        let mode = 'teach'; 
        let possibleMoves = [];
        let isAnimating = false;
        let selected = false;

        // Elementos DOM
        const introScreen = document.getElementById('introScreen');
        const gameScreen = document.getElementById('gameScreen');
        const boardEl = document.getElementById('board');
        const statusText = document.getElementById('statusText');
        const teacherControls = document.getElementById('teacherControls');
        const demoText = document.getElementById('demoText');
        const btnDemo = document.getElementById('btnDemo');
        const btnTeach = document.getElementById('btnTeach');
        const btnPractice = document.getElementById('btnPractice');

        let knightEl; // Referencia a nuestra pieza del caballo flotante

        // ==== AUDIO SIMPLE ====
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'step') { 
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'turn') { 
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99].forEach((f, i) => {
                    const oscN = audioCtx.createOscillator();
                    const gainN = audioCtx.createGain();
                    oscN.connect(gainN);
                    gainN.connect(audioCtx.destination);
                    oscN.frequency.value = f;
                    gainN.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
                    oscN.start(audioCtx.currentTime + i * 0.1);
                    oscN.stop(audioCtx.currentTime + i * 0.1 + 0.3);
                });
            }
        }

        // ==== LÓGICA DE MOVIMIENTO ====
        function getValidMoves(r, c) {
            const moves = [
                { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
                { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
                { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
                { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
            ];
            return moves.map(m => ({ row: r + m.dr, col: c + m.dc }))
                        .filter(m => m.row >= 0 && m.row < 8 && m.col >= 0 && m.col < 8);
        }

        function getLPath(r1, c1, r2, c2) {
            let path = [];
            let dr = r2 - r1;
            let dc = c2 - c1;

            if (Math.abs(dr) === 2) {
                path.push({ row: r1 + Math.sign(dr)*1, col: c1 });
                path.push({ row: r1 + dr, col: c1 });              
                path.push({ row: r2, col: c2 });                   
            } else {
                path.push({ row: r1, col: c1 + Math.sign(dc)*1 }); 
                path.push({ row: r1, col: c2 });                   
                path.push({ row: r2, col: c2 });                   
            }
            return path;
        }

        // ==== INICIALIZAR EL TABLERO (Solo una vez) ====
        function initBoard() {
            boardEl.innerHTML = '';
            // Crear cuadrícula
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if ((r + c) % 2 === 1) cell.classList.add('dark');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardEl.appendChild(cell);
                }
            }

            // Crear el caballo flotante
            knightEl = document.createElement('div');
            knightEl.className = 'knight';
            knightEl.innerHTML = '<span class="knight-icon">♞</span>';
            boardEl.appendChild(knightEl);

            // Delegación de eventos de clic en el tablero
            boardEl.addEventListener('click', (e) => {
                if (isAnimating) return;
                const cell = e.target.closest('.cell');
                if (!cell) return;
                
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);

                if (mode === 'practice') {
                    // Si toca donde está el caballo actualmente
                    if (r === knightPos.row && c === knightPos.col) {
                        if (!selected) {
                            selected = true;
                            possibleMoves = getValidMoves(knightPos.row, knightPos.col);
                            statusText.textContent = "⭐ ¡Toca una de las estrellas para saltar!";
                            playSound('step');
                            renderBoard();
                        }
                    } else {
                        // Si toca una casilla objetivo
                        const isTarget = possibleMoves.some(m => m.row === r && m.col === c);
                        if (isTarget) {
                            handleCellClick(r, c);
                        } else if (selected) {
                            // Si toca en otra parte, se deselecciona
                            selected = false;
                            possibleMoves = [];
                            statusText.textContent = "👉 Toca el caballo ♞ para empezar a jugar.";
                            renderBoard();
                        }
                    }
                }
            });
        }

        // ==== ACTUALIZAR ESTADO DEL TABLERO ====
        function renderBoard() {
            // Mover el caballo visualmente (esto activa la animación CSS)
            knightEl.style.top = `${knightPos.row * 12.5}%`;
            knightEl.style.left = `${knightPos.col * 12.5}%`;

            const cells = boardEl.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                
                // Limpiar clases si no está animando
                if (!isAnimating) {
                    cell.className = 'cell' + ((r + c) % 2 === 1 ? ' dark' : '');
                }

                // Dibujar estrellas de objetivo
                const isTarget = possibleMoves.some(m => m.row === r && m.col === c);
                if (isTarget && !isAnimating) {
                    cell.classList.add('target');
                }

                // Cambiar el cursor
                if (mode === 'practice' && !isAnimating && ((r === knightPos.row && c === knightPos.col) || isTarget)) {
                    cell.style.cursor = 'pointer';
                } else {
                    cell.style.cursor = 'default';
                }
            });
        }

        // ==== ANIMACIÓN DE LA "L" CON MOVIMIENTO DESLIZANTE ====
        function animateLMove(r1, c1, r2, c2, callback) {
            isAnimating = true;
            possibleMoves = []; 
            selected = false;
            
            // Limpiar cualquier rastro anterior
            boardEl.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('trail-1', 'trail-2', 'trail-3', 'target');
            });

            const path = getLPath(r1, c1, r2, c2);
            let step = 0;
            const texts = ["¡Uno... 🔵", "Dos... 🔵", "¡Y GIRO! 🔴"];

            function nextStep() {
                if (step < path.length) {
                    const cellCoord = path[step];
                    // Buscar la casilla exacta
                    const cellEl = boardEl.querySelector(`.cell[data-row="${cellCoord.row}"][data-col="${cellCoord.col}"]`);
                    
                    if (mode === 'teach') demoText.textContent = texts[step];
                    if (mode === 'practice') statusText.textContent = texts[step];

                    // Dibujar el número / burbuja
                    if (step === 2) {
                        cellEl.classList.add('trail-3');
                        playSound('turn');
                    } else {
                        cellEl.classList.add(`trail-${step + 1}`);
                        playSound('step');
                    }

                    // *** AQUÍ ESTÁ LA MEJORA: El caballo avanza paso a paso ***
                    knightPos = { row: cellCoord.row, col: cellCoord.col };
                    renderBoard(); // Actualiza la posición y hace que se deslice

                    step++;
                    // Esperar 600ms a que termine de deslizarse antes de dar el siguiente paso
                    setTimeout(nextStep, 600); 
                } else {
                    setTimeout(() => {
                        isAnimating = false;
                        playSound('win');
                        renderBoard(); // Limpiar el tablero
                        if(callback) callback();
                    }, 400);
                }
            }
            nextStep();
        }

        // ==== INTERACCIONES ====
        function runDemo() {
            if (isAnimating) return;
            const moves = getValidMoves(knightPos.row, knightPos.col);
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            
            btnDemo.disabled = true;
            animateLMove(knightPos.row, knightPos.col, randomMove.row, randomMove.col, () => {
                demoText.textContent = "¡Ves! 2 pasos rectos y 1 al lado. ¡Intenta de nuevo!";
                btnDemo.disabled = false;
                renderBoard();
            });
        }

        function handleCellClick(r, c) {
            if (isAnimating) return;
            
            animateLMove(knightPos.row, knightPos.col, r, c, () => {
                statusText.textContent = "🏆 ¡Excelente! Toca el caballo para otro salto.";
                renderBoard();
            });
        }

        function setMode(newMode) {
            if (isAnimating) return;
            mode = newMode;
            selected = false;
            possibleMoves = [];

            if (mode === 'teach') {
                teacherControls.classList.add('active');
                statusText.textContent = "👨‍🏫 El Profe Explica";
                demoText.textContent = "Presiona el botón para ver cómo dibuja la 'L' mágica ✨";
                btnTeach.classList.add('active');
                btnPractice.classList.remove('active');
                knightPos = { row: 4, col: 3 }; 
            } else {
                teacherControls.classList.remove('active');
                statusText.textContent = "👉 Toca el caballo ♞ para empezar a jugar.";
                btnPractice.classList.add('active');
                btnTeach.classList.remove('active');
                knightPos = { row: 7, col: 1 }; 
            }
            renderBoard();
        }

        // ==== EVENTOS ====
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!audioCtx) playSound('step'); 
            introScreen.classList.remove('active');
            gameScreen.classList.add('active');
            setMode('teach');
        });

        btnDemo.addEventListener('click', runDemo);
        btnTeach.addEventListener('click', () => setMode('teach'));
        btnPractice.addEventListener('click', () => setMode('practice'));

        // Cargar el tablero inicial oculto
        initBoard();

    </script>
</body>
</html>
