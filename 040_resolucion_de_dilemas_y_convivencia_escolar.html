<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Armonía 2.0 - Valores</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #070a13; 
            --card: #161e2d;
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-body: #cbd5e1;
            --danger: #ff4d4d;
            --success: #00e676;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border: 3px solid #334155;
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 32px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        h1 { font-size: 2.2rem; line-height: 1.1; margin-bottom: 15px; }
        p { font-size: 1.3rem; line-height: 1.5; color: var(--text-body); }

        .header { padding: 30px 25px 15px; }

        .progress-track {
            height: 16px;
            background: #0f172a;
            border-radius: 20px;
            border: 2px solid #334155;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 20px;
            transition: width 0.8s ease-out;
        }

        .stage {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .char-box {
            font-size: 90px;
            text-align: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--accent));
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
        }

        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-choice {
            background: #1e293b;
            border: 2px solid #475569;
            color: white;
            padding: 20px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 500;
            text-align: left;
            transition: 0.2s;
        }

        .btn-choice:hover {
            border-color: var(--accent);
            background: #334155;
        }

        .feedback-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 19, 0.98);
            z-index: 200;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .feedback-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            border: 3px solid var(--danger);
            width: 100%;
        }

        .feedback-card.is-correct { border-color: var(--success); }

        .btn-continue {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 20px 40px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.2rem;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body x-data="gameLogic()" x-init="shuffleOptions()">

    <div id="app-container">
        <div class="feedback-overlay" x-show="view === 'intro'">
            <div class="char-box">🏫</div>
            <h1>Misión Recreo</h1>
            <p>Tus decisiones determinan la armonía de la escuela. ¿Podrás ser un líder positivo?</p>
            <button class="btn-continue" @click="view = 'playing'">¡EMPEZAR!</button>
        </div>

        <div class="feedback-overlay" x-show="view === 'end'">
            <div class="char-box">🏆</div>
            <h1 x-text="score >= 70 ? '¡Excelente Líder!' : '¡A seguir practicando!'"></h1>
            <p x-text="'Puntaje de Armonía Social: ' + score + '%'"></p>
            <button class="btn-continue" @click="location.reload()">REINTENTAR</button>
        </div>

        <div class="feedback-overlay" x-show="feedback.show" x-transition>
            <div class="feedback-card" :class="feedback.isCorrect ? 'is-correct' : ''">
                <div style="font-size: 50px; margin-bottom: 10px;" x-text="feedback.isCorrect ? '✅' : '❌'"></div>
                <h2 style="margin-bottom: 15px;" x-text="feedback.isCorrect ? '¡Muy bien!' : 'Podría ser mejor...'"></h2>
                <p style="color: white; margin-bottom: 15px;" x-text="feedback.message"></p>
                <div x-show="!feedback.isCorrect" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px;">
                    <p style="font-size: 1.1rem; color: var(--success);">
                        <strong>Lo correcto sería:</strong> <span x-text="feedback.correctOption"></span>
                    </p>
                </div>
                <button class="btn-continue" @click="nextQuestion()">CONTINUAR</button>
            </div>
        </div>

        <div class="header">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800;">
                <span x-text="'DILEMA ' + (current + 1)"></span>
                <span x-text="score + '%'" :style="{color: score > 50 ? 'var(--success)' : 'var(--danger)'}"></span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" :style="'width:' + score + '%'"></div>
            </div>
        </div>

        <main class="stage" x-show="view === 'playing'">
            <div class="char-box" x-text="story[current].icon"></div>
            <h2 class="question-text" x-text="story[current].q"></h2>

            <div class="options-stack">
                <template x-for="(opt, i) in story[current].options" :key="i">
                    <button class="btn-choice" @click="processChoice(opt)" x-text="opt.t"></button>
                </template>
            </div>
        </main>
    </div>

    <script>
        function gameLogic() {
            return {
                view: 'intro',
                current: 0,
                score: 50,
                feedback: { show: false, message: '', isCorrect: false, correctOption: '' },
                story: [
                    {
                        icon: '🏀',
                        q: 'Un compañero se cae y todos se ríen de él. ¿Qué haces?',
                        options: [
                            { t: 'Ayudarle a levantarse y preguntar si está bien.', val: 20, correct: true },
                            { t: 'Reírte un poco también para encajar.', val: -20, correct: false },
                            { t: 'Ignorar la situación y seguir caminando.', val: -10, correct: false }
                        ],
                        correctText: 'Ayudarle a levantarse. La empatía fortalece la amistad y hace que todos se sientan seguros.'
                    },
                    {
                        icon: '🍎',
                        q: 'Ves que a alguien se le cae dinero de la mochila sin darse cuenta.',
                        options: [
                            { t: 'Avisarle de inmediato y entregárselo.', val: 20, correct: true },
                            { t: 'Quedarte callado y recogerlo cuando no vean.', val: -30, correct: false },
                            { t: 'Ponerle el pie encima para que nadie más lo vea.', val: -25, correct: false }
                        ],
                        correctText: 'Devolverlo de inmediato. La honestidad es la base de la confianza en la escuela.'
                    },
                    {
                        icon: '🤫',
                        q: 'Tus amigos están inventando un chisme feo sobre la profesora.',
                        options: [
                            { t: 'Decirles que eso no está bien y cambiar de tema.', val: 20, correct: true },
                            { t: 'Escuchar con atención y luego contarlo a otros.', val: -20, correct: false },
                            { t: 'Aumentar una mentira para que sea más gracioso.', val: -30, correct: false }
                        ],
                        correctText: 'Poner un alto al chisme. El respeto a los docentes es fundamental para el aprendizaje.'
                    },
                    {
                        icon: '🗑️',
                        q: 'Ves a un compañero tirando basura detrás de los arbustos.',
                        options: [
                            { t: 'Recordarle que hay botes de basura cerca.', val: 20, correct: true },
                            { t: 'Tirar tu basura ahí también ya que nadie ve.', val: -20, correct: false },
                            { t: 'Fingir que no viste nada.', val: -5, correct: false }
                        ],
                        correctText: 'Invitarlo a usar el basurero. Cuidar el colegio es cuidar nuestra segunda casa.'
                    }
                ],

                shuffleOptions() {
                    this.story.forEach(scene => {
                        for (let i = scene.options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [scene.options[i], scene.options[j]] = [scene.options[j], scene.options[i]];
                        }
                    });
                },

                processChoice(opt) {
                    const scene = this.story[this.current];
                    this.feedback.isCorrect = opt.correct;
                    this.feedback.correctOption = scene.correctText;
                    this.feedback.message = opt.correct ? "¡Has actuado con valores!" : "Esta acción daña la convivencia escolar.";
                    
                    if (opt.correct) {
                        this.score = Math.min(100, this.score + opt.val);
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    } else {
                        this.score = Math.max(0, this.score + opt.val);
                        gsap.to("#app-container", { x: 15, repeat: 5, yoyo: true, duration: 0.05 });
                    }
                    this.feedback.show = true;
                },

                nextQuestion() {
                    this.feedback.show = false;
                    if (this.current < this.story.length - 1) {
                        this.current++;
                    } else {
                        this.view = 'end';
                    }
                }
            }
        }
    </script>
</body>
</html>
