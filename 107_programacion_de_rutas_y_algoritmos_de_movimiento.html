<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eco-Bus Pro: Ciudad Lógica 🚌</title>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bus-yellow: #facc15;
            --energy-color: #3b82f6;
            --mud: #78350f;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Public Sans', sans-serif; }
        h2, .btn-action { font-family: 'Unbounded', sans-serif; text-transform: uppercase; }

        body { background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- UI OVERLAYS --- */
        .resultado-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(8px);
        }

        .card-animada {
            background: white; color: #1e293b; padding: 30px; border-radius: 30px;
            text-align: center; max-width: 450px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border-bottom: 8px solid #cbd5e1;
        }

        .info-box {
            text-align: left; background: #f1f5f9; padding: 15px; border-radius: 15px;
            margin: 15px 0; font-size: 0.85rem; color: #334155; line-height: 1.4;
        }

        /* --- CIUDAD / GRID --- */
        .escenario { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }

        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
            gap: 6px; background: #334155; padding: 8px; border-radius: 16px;
            width: min(85vw, 380px); height: min(85vw, 380px);
        }

        .cell {
            background: #475569; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; position: relative;
        }

        .cell-deco::after { content: "🏠"; font-size: 1.2rem; opacity: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        .cell-tree::after { content: "🌳"; font-size: 1.2rem; opacity: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

        .cell-mud { background: var(--mud); border: 1px solid rgba(255,255,255,0.1); }
        .cell-mud::before { content: "🚧"; font-size: 0.7rem; position: absolute; top: 2px; left: 2px; }
        
        .ninos-container { font-size: 1.1rem; letter-spacing: -2px; z-index: 10; display: flex; }

        .cell-stop { background: #065f46; border: 2px dashed #34d399; }
        .cell-goal { background: #ef4444; }

        .bus { font-size: 2rem; position: absolute; z-index: 100; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* --- CONSOLA --- */
        .consola { background: #0f172a; padding: 15px; border-top: 4px solid #1e293b; }

        .linea-programacion {
            background: #1e293b; min-height: 60px; border-radius: 15px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px; padding: 10px; overflow-x: auto;
            border: 2px solid #334155;
        }

        .bloque {
            min-width: 42px; height: 42px; border-radius: 10px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; color: white;
        }
        .b-up { background: #f87171; } .b-down { background: #fbbf24; color: #451a03; }
        .b-left { background: #60a5fa; } .b-right { background: #a78bfa; }

        .controles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-run { 
            grid-column: span 4; background: var(--energy-color); color: white; 
            padding: 16px; border-radius: 14px; border: none; font-weight: 900; 
            cursor: pointer; box-shadow: 0 6px 0 #1d4ed8;
        }
        
        .btn-reset-small {
            background: #334155; color: #94a3b8; border: none; padding: 8px; 
            border-radius: 10px; font-size: 0.7rem; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body x-data="cityBus()">

    <template x-if="fase === 'inicio'">
        <div class="resultado-overlay" x-transition>
            <div class="card-animada">
                <div style="font-size: 3rem; margin-bottom: 10px;">🚌✨</div>
                <h2 style="color: #0f172a; font-size: 1.4rem;">Eco-Bus Pro</h2>
                
                <div class="info-box">
                    <p><b>📍 Dirigido a:</b> 4to a 6to Grado de Primaria</p>
                    <p><b>🧠 Contenido:</b> Pensamiento Lógico y Programación</p>
                    <p><b>🎯 Objetivo:</b> Programar la ruta para recoger a los niños y llegar a la escuela de forma eficiente.</p>
                </div>

                <p style="font-size: 0.9rem; color: #475569; margin-bottom: 20px; font-weight: 600;">
                    Usa las flechas para planear tu ruta. Primero recoge a los niños 👦👧 y luego llega a la escuela 🚩. 
                    <i>¡Puedes pasar sobre el barro con cuidado!</i>
                </p>

                <button @click="fase = 'juego'" class="btn-action" 
                        style="background: #3b82f6; color: white; padding: 18px; border-radius: 50px; border: none; width: 100%; cursor: pointer; font-size: 1rem;">
                    ¡COMENZAR MISIÓN!
                </button>
            </div>
        </div>
    </template>

    <template x-if="fase === 'resultado'">
        <div class="resultado-overlay" x-transition>
            <div class="card-animada" :style="{ borderBottomColor: resColor }">
                <div style="font-size: 4rem; margin-bottom: 10px;" x-text="resIcon"></div>
                <h2 :style="{color: resColor}" x-text="resTitle"></h2>
                <p style="margin: 15px 0; font-weight: 600; line-height: 1.4;" x-text="resMsg"></p>
                <button @click="reiniciar()" class="btn-action" 
                        style="background: #1e293b; color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; cursor: pointer;">
                    REINTENTAR RUTA
                </button>
            </div>
        </div>
    </template>

    <header style="padding: 15px 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 900; margin-bottom: 5px;">
            <span>ENERGÍA ECO-BUS</span>
            <span x-text="energia + '%'"></span>
        </div>
        <div style="width: 100%; height: 10px; background: #334155; border-radius: 10px; overflow: hidden;">
            <div style="height: 100%; transition: 0.5s;" :style="{width: energia + '%', background: energia < 30 ? '#ef4444' : '#3b82f6'}"></div>
        </div>
    </header>

    <main class="escenario">
        <div class="grid">
            <template x-for="i in 25">
                <div class="cell" :class="getCellClass(i-1)">
                    <div class="ninos-container" x-show="stopPos === (i-1)">👦👧</div>
                    <span x-show="goalPos === (i-1)" style="z-index: 10;">🚩</span>
                    <div class="bus" x-show="busPos === (i-1)" id="bus-sprite">🚌</div>
                </div>
            </template>
        </div>
    </main>

    <footer class="consola">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.65rem; font-weight: 900; color: #64748b;">PROGRAMA TU ALGORITMO</span>
            <button class="btn-reset-small" @click="limpiar()">LIMPIAR</button>
        </div>
        
        <div class="linea-programacion">
            <template x-for="p in pasos">
                <div class="bloque" :class="getBloqueClass(p)" x-text="getFlecha(p)"></div>
            </template>
        </div>

        <div class="controles">
            <button class="bloque b-up" @click="addStep('U')">↑</button>
            <button class="bloque b-down" @click="addStep('D')">↓</button>
            <button class="bloque b-left" @click="addStep('L')">←</button>
            <button class="bloque b-right" @click="addStep('R')">→</button>
            <button class="btn-run" @click="ejecutar()" :disabled="ejecutando || pasos.length === 0">EJECUTAR</button>
        </div>
    </footer>

    <script>
        function cityBus() {
            return {
                fase: 'inicio', // Inicia en la pantalla de introducción
                busPos: 20, 
                stopPos: 12, 
                goalPos: 4,
                energia: 100,
                pasos: [],
                ejecutando: false,
                mudZones: [11, 13, 7, 8, 9], 
                decoCasas: [0, 1, 14, 24],
                decoArboles: [2, 5, 19, 21, 23],

                resIcon: '', resTitle: '', resMsg: '', resColor: '',

                getCellClass(i) {
                    if (this.mudZones.includes(i)) return 'cell-mud';
                    if (this.stopPos === i) return 'cell-stop';
                    if (this.goalPos === i) return 'cell-goal';
                    if (this.decoCasas.includes(i)) return 'cell-deco';
                    if (this.decoArboles.includes(i)) return 'cell-tree';
                    return '';
                },
                getBloqueClass(p) { return { 'b-up': p==='U', 'b-down': p==='D', 'b-left': p==='L', 'b-right': p==='R' }; },
                getFlecha(p) { return { 'U':'↑', 'D':'↓', 'L':'←', 'R':'→' }[p]; },
                addStep(dir) { if (this.pasos.length < 12 && !this.ejecutando) this.pasos.push(dir); },
                
                async ejecutar() {
                    this.ejecutando = true;
                    let hasKids = false;

                    for (let p of this.pasos) {
                        await new Promise(r => setTimeout(r, 500));
                        
                        let next = this.busPos;
                        if (p === 'U' && this.busPos >= 5) next -= 5;
                        else if (p === 'D' && this.busPos <= 19) next += 5;
                        else if (p === 'L' && this.busPos % 5 !== 0) next -= 1;
                        else if (p === 'R' && (this.busPos + 1) % 5 !== 0) next += 1;

                        if (this.decoCasas.includes(next)) {
                            this.busPos = next;
                            gsap.to("#bus-sprite", { x: 5, repeat: 5, yoyo: true, duration: 0.05 });
                            this.mostrarFin('💥', '¡CHOQUE!', 'Has chocado contra una casa. ¡Ten más cuidado con el volante!', '#ef4444');
                            return;
                        }
                        if (this.decoArboles.includes(next)) {
                            this.busPos = next;
                            gsap.to("#bus-sprite", { x: 5, repeat: 5, yoyo: true, duration: 0.05 });
                            this.mostrarFin('🌳', '¡ACCIDENTE!', '¡Cuidado con la naturaleza! Chocaste contra un árbol.', '#ef4444');
                            return;
                        }

                        this.busPos = next;
                        this.energia -= this.mudZones.includes(this.busPos) ? 20 : 10;
                        if (this.busPos === this.stopPos) hasKids = true;
                        
                        if (this.energia <= 0 && this.busPos !== this.goalPos) {
                            this.mostrarFin('🪫', 'SIN BATERÍA', 'El bus se quedó sin energía. El barro consume un poco más de carga.', '#f59e0b');
                            return;
                        }
                    }

                    if (this.busPos === this.goalPos) {
                        if (hasKids) {
                            confetti({ particleCount: 150, spread: 70 });
                            this.mostrarFin('🏆', '¡LOGRADO!', 'Ruta perfecta. Los niños llegaron a salvo.', '#22c55e');
                        } else {
                            this.mostrarFin('👦👧', '¿Y LOS NIÑOS?', 'Llegaste a la escuela, pero olvidaste recoger a los niños.', '#f59e0b');
                        }
                    } else {
                        this.mostrarFin('📍', 'RUTA ERRÓNEA', 'El algoritmo no terminó en la escuela.', '#64748b');
                    }
                },
                mostrarFin(icon, title, msg, color) {
                    this.resIcon = icon; this.resTitle = title;
                    this.resMsg = msg; this.resColor = color;
                    setTimeout(() => { this.fase = 'resultado'; }, 600);
                },
                limpiar() { this.pasos = []; this.energia = 100; },
                reiniciar() {
                    this.busPos = 20; this.pasos = []; 
                    this.energia = 100; this.ejecutando = false; 
                    this.fase = 'juego';
                }
            }
        }
    </script>
</body>
</html>
