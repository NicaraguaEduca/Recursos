<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master en Guion Teatral 🎭</title>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dialogo-btn: #fbbf24;
            --acotacion-btn: #8b5cf6;
            --bg-main: #0f172a;
            --text-dark: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Public Sans', sans-serif; }
        h1, h2, h3, .btn-action { font-family: 'Unbounded', sans-serif; text-transform: uppercase; }

        body { 
            background: var(--bg-main); 
            color: white; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- PANTALLAS (INICIO Y FINAL) --- */
        .overlay {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 15px;
        }

        .ficha-tecnica {
            background: white; color: var(--text-dark); padding: 25px;
            border-radius: 25px; max-width: 500px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-top: 8px solid var(--dialogo-btn);
            text-align: center;
        }

        .ficha-item { margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; text-align: left; }
        .ficha-item b { color: #4338ca; font-size: 0.75rem; display: block; }

        /* --- ESCENARIO --- */
        .escenario { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            min-height: 40vh;
        }

        .actor-grande { 
            font-size: clamp(5rem, 15vh, 8rem); 
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4)); 
        }
        
        .bocadillo-voz {
            position: absolute; top: 10%; background: white; color: black;
            padding: 10px 20px; border-radius: 20px; font-weight: 900;
            transform: scale(0); box-shadow: 0 8px 0 #cbd5e1;
            z-index: 10; font-size: 0.9rem;
        }

        /* --- CONSOLA --- */
        .consola {
            background: #1e293b; 
            padding: 20px;
            border-top: 4px solid #334155; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 15px;
            width: 100%;
        }

        .caja-guion {
            background: #f8fafc; color: var(--text-dark); 
            padding: 20px; border-radius: 15px; width: 100%; max-width: 700px;
            text-align: center; 
            font-size: clamp(1rem, 4vw, 1.4rem); 
            font-weight: 900;
            box-shadow: 0 6px 0 #94a3b8;
            min-height: 85px;
            display: flex; align-items: center; justify-content: center;
        }

        .botones-container { display: flex; gap: 12px; width: 100%; max-width: 700px; }

        .btn-opcion {
            flex: 1; padding: 15px 10px; border-radius: 15px; border: none;
            color: white; font-weight: 900; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .btn-d { background: var(--dialogo-btn); color: #451a03; box-shadow: 0 5px 0 #b45309; }
        .btn-a { background: var(--acotacion-btn); color: white; box-shadow: 0 5px 0 #5b21b6; }
        .btn-opcion:active { transform: translateY(3px); box-shadow: none; }

        .tag-d { color: #b45309; text-decoration: underline; }
        .tag-a { color: #8b5cf6; font-style: italic; }

        #feedback {
            position: absolute; top: 10px; width: 90%; text-align: center;
            font-weight: 900; padding: 10px; border-radius: 10px; 
            display: none; z-index: 20; font-size: 0.85rem;
        }

        @media (max-width: 500px) {
            .botones-container { flex-direction: column; }
            .btn-opcion { width: 100%; }
        }
    </style>
</head>
<body x-data="guionApp()">

    <template x-if="fase === 'inicio'">
        <div class="overlay">
            <div class="ficha-tecnica" x-transition:enter="gsap.from($el, {y: 50, opacity:0})">
                <h2 style="margin-bottom: 15px; font-size: 1.2rem;">🎬 Master de Guion</h2>
                <div class="ficha-item"><b>🎯 Objetivo</b><p>Identificar diálogos y acotaciones en un libreto.</p></div>
                <div class="ficha-item"><b>💡 Propósito</b><p>Diferenciar lo que se dice de lo que se hace.</p></div>
                <div class="ficha-item"><b>🧒 Grado</b><p>4º a 6º de Primaria.</p></div>
                <button @click="fase = 'juego'" style="background: #4338ca; color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; margin-top: 10px; font-weight: 900; cursor: pointer;">¡EMPEZAR!</button>
            </div>
        </div>
    </template>

    <template x-if="fase === 'fin'">
        <div class="overlay" style="background: rgba(15, 23, 42, 0.9);">
            <div class="ficha-tecnica" style="border-top: 8px solid #10b981;">
                <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
                <h2 style="color: #10b981; font-size: 2rem; margin-bottom: 10px;">¡EXCELENTE!</h2>
                <p style="margin-bottom: 25px; font-weight: 700;">Has acertado correctamente todas las partes del libreto. ¡Eres un gran director!</p>
                <button @click="reiniciar()" style="background: #10b981; color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; font-weight: 900; cursor: pointer;">VOLVER A ENSAYAR</button>
            </div>
        </div>
    </template>

    <main class="escenario">
        <div id="feedback"></div>
        <div class="bocadillo-voz" id="bocadillo"></div>
        <div class="actor-grande" id="actor">🧛</div>
    </main>

    <footer class="consola">
        <div class="caja-guion" id="guion-texto" x-html="getFrase()"></div>

        <div class="botones-container">
            <button class="btn-opcion btn-d" @click="verificar('dialogo')">
                <span style="font-size: 1rem;">💬 DIÁLOGO</span>
                <small style="font-size: 0.65rem; font-weight: 400;">El personaje está HABLANDO</small>
            </button>
            <button class="btn-opcion btn-a" @click="verificar('acotacion')">
                <span style="font-size: 1rem;">📝 ACOTACIÓN</span>
                <small style="font-size: 0.65rem; font-weight: 400;">Es una ACCIÓN</small>
            </button>
        </div>
        <p style="color: #64748b; font-size: 0.7rem; font-weight: 700;">GUION: EL MISTERIO DEL CASTILLO</p>
    </footer>

    <script>
        function guionApp() {
            return {
                fase: 'inicio',
                indice: 0,
                pasos: [
                    { t: "DRÁCULA: ¡Bienvenidos a mi castillo!", tipo: "dialogo", voz: "¡Bienvenidos!" },
                    { t: "(Hace una reverencia elegante)", tipo: "acotacion" },
                    { t: "DRÁCULA: ¿Tienen sed? Les traeré algo...", tipo: "dialogo", voz: "¡Algo rojo!" },
                    { t: "(Se ríe de forma misteriosa)", tipo: "acotacion" },
                    { t: "DRÁCULA: ¡No teman a mis murciélagos!", tipo: "dialogo", voz: "¡No teman!" },
                    { t: "(Se envuelve en su capa)", tipo: "acotacion" }
                ],
                getFrase() {
                    let frase = this.pasos[this.indice].t;
                    return frase.includes(':') 
                        ? frase.replace(/(.*?):/, '<span class="tag-d">$1:</span>')
                        : `<span class="tag-a">${frase}</span>`;
                },
                verificar(input) {
                    const actual = this.pasos[this.indice];
                    const fb = document.getElementById('feedback');
                    
                    if (input === actual.tipo) {
                        fb.style.display = "none";
                        if (actual.tipo === 'dialogo') {
                            const b = document.getElementById('bocadillo');
                            b.innerText = actual.voz;
                            gsap.to("#bocadillo", { scale: 1, duration: 0.3 });
                            setTimeout(() => gsap.to("#bocadillo", { scale: 0, duration: 0.3 }), 1200);
                        } else {
                            gsap.to("#actor", { scale: 1.15, rotation: 5, yoyo: true, repeat: 1, duration: 0.2 });
                        }

                        if (this.indice < this.pasos.length - 1) {
                            setTimeout(() => this.indice++, 600);
                        } else {
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                            setTimeout(() => { this.fase = 'fin'; }, 800);
                        }
                    } else {
                        fb.style.display = "block";
                        fb.style.background = "#ef4444";
                        fb.innerText = actual.tipo === 'dialogo' ? "⚠️ Si hay un nombre y ':', es Diálogo." : "⚠️ Si hay (paréntesis), es Acotación.";
                        gsap.to("#guion-texto", { x: 5, repeat: 5, yoyo: true, duration: 0.05 });
                    }
                },
                reiniciar() {
                    this.indice = 0;
                    this.fase = 'inicio';
                }
            }
        }
    </script>
</body>
</html>
